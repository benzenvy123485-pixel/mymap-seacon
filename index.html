<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MyScape · ชั้น 1 My Pulse — ตัวอย่างระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   MyScape — ตู้ประชาสัมพันธ์ จอแนวตั้ง 9:16 ทัชสกรีน
   ชั้น 1 · My Pulse
   ------------------------------------------------------------------
   ครึ่งบน   แผนผัง 3 มิติ เรนเดอร์เองบน canvas 2 มิติ ไม่มี dependency
   ครึ่งล่าง ค้นหา + ตารางร้าน จิ้มแล้วกล้องบินไปหาร้านนั้น

   สีทั้งงานถอดมาจากเด็ค MyScape เอง
   ก้อนร้านในภาพ 3 มิติใช้สีเดียวกับกล่องยูนิตในผังสถาปนิก
   เพื่อให้คนโยงภาพ 3 มิติกลับไปหาผังที่เขาเคยเห็นได้
   ================================================================== */
:root{
  --u: min(1vw, 0.5625dvh);
  /* Prompt ทั้งงาน สร้างลำดับความสำคัญด้วยน้ำหนักและระยะห่างตัวอักษร ไม่สลับฟอนต์ */
  --f-display:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Prompt","Noto Sans Thai",system-ui,sans-serif;

  /* ---- โทนสี MyScape · แก้ทั้งงานได้ที่นี่จุดเดียว ---- */
  --paper:#EDE9DA;        /* กระดาษครีมของเด็ค */
  --paper-2:#F7F4EA;      /* การ์ดที่ลอยขึ้นมา */
  --paper-3:#E3DFCE;      /* ร่องและพื้นหลังช่องค้นหา */
  --plate:#DCD8C7;        /* พื้นชั้นในภาพ 3 มิติ */
  --walk:#E9E5D6;         /* ทางเดิน */
  --unit:#F2DEB6;         /* สีกล่องยูนิตในผังสถาปนิก */
  --sage:#C6D5C9;         /* พื้นที่สีเขียวในผัง */
  --clay:#C0703F;         /* เทอร์ราคอตต้าของโลโก้ MyScape — ใช้ที่เดียวคือจุดที่คุณอยู่ */
  --olive:#93937A;        /* ตัวอักษรรอง */
  --ink:#23231F;
  --ink-soft:rgba(35,35,31,.56);
  --hair:rgba(35,35,31,.14);
  --slow:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#D6D2C2}
body{
  font-family:var(--f-body);font-weight:300;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.stage{
  position:relative;width:100vw;height:100dvh;
  max-width:calc(100dvh*9/16);margin:0 auto;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
}

/* ---------- หัวจอ ---------- */
.head{padding:calc(var(--u)*5) calc(var(--u)*5.5) calc(var(--u)*2.5)}
.topline{display:flex;align-items:center;gap:calc(var(--u)*2.2);flex-wrap:wrap}
.badge{
  border:1px solid var(--clay);color:var(--clay);border-radius:999px;
  padding:calc(var(--u)*.7) calc(var(--u)*2);font-size:calc(var(--u)*1.9);
  letter-spacing:.1em;white-space:nowrap;
}
.eyebrow{
  font-size:calc(var(--u)*2.1);font-weight:300;letter-spacing:.42em;
  text-transform:uppercase;color:var(--olive);
}
.zone{
  display:flex;align-items:baseline;gap:calc(var(--u)*2.6);
  margin-top:calc(var(--u)*1.2);
}
.zone .lvl{
  font-family:var(--f-display);font-weight:200;font-size:calc(var(--u)*4.4);
  color:var(--clay);letter-spacing:.06em;
}
.zone h1{
  font-family:var(--f-display);font-weight:200;font-size:calc(var(--u)*8.4);
  letter-spacing:-.005em;line-height:1;
}
.zone h1 b{font-weight:500}
.tag{
  margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*2.9);
  color:var(--ink-soft);font-weight:300;
}
.note{
  margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*2.05);
  color:var(--olive);font-weight:300;
}

/* ---------- แผนผัง ---------- */
.mapwrap{position:relative;flex:0 0 auto;height:41dvh}
#view{width:100%;height:100%;display:block;touch-action:none}
.tools{
  position:absolute;right:calc(var(--u)*3.5);bottom:calc(var(--u)*3.5);
  display:flex;flex-direction:column;gap:calc(var(--u)*1.6);
}
.tool{
  width:calc(var(--u)*8);height:calc(var(--u)*8);border-radius:50%;
  border:1px solid var(--hair);background:rgba(247,244,234,.86);
  color:var(--ink);font-size:calc(var(--u)*3.6);font-family:var(--f-display);
  font-weight:300;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s var(--slow);
}
.tool:active{background:var(--paper-3)}
.hint{
  position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*4);
  font-size:calc(var(--u)*2.2);color:var(--olive);letter-spacing:.16em;
  transition:opacity .6s var(--slow);
}
.hint.gone{opacity:0}

/* ---------- แถบชั้น ---------- */
.floors{
  display:flex;gap:calc(var(--u)*1.4);
  padding:calc(var(--u)*2.4) calc(var(--u)*5) calc(var(--u)*2);
}
.fl{
  flex:1;border:1px solid var(--hair);background:transparent;border-radius:calc(var(--u)*1.4);
  padding:calc(var(--u)*1.6) 0 calc(var(--u)*1.5);cursor:pointer;
  font-family:var(--f-body);color:var(--ink-soft);text-align:center;
  transition:all .25s var(--slow);
}
.fl .n{
  display:block;font-family:var(--f-display);font-weight:300;
  font-size:calc(var(--u)*2.3);letter-spacing:.2em;color:var(--olive);
}
.fl .z{display:block;font-size:calc(var(--u)*2.6);font-weight:400;margin-top:calc(var(--u)*.5)}
.fl.on{background:var(--ink);border-color:var(--ink)}
.fl.on .n{color:rgba(247,244,234,.6)}
.fl.on .z{color:var(--paper-2)}
.fl.off{opacity:.42;cursor:default}

/* ---------- ค้นหา + กรอง ---------- */
.find{padding:0 calc(var(--u)*5) calc(var(--u)*2)}
.searchbox{
  display:flex;align-items:center;gap:calc(var(--u)*2);
  background:var(--paper-3);border-radius:calc(var(--u)*1.6);
  padding:calc(var(--u)*2.1) calc(var(--u)*2.8);
}
.searchbox svg{flex:0 0 auto;opacity:.5}
#q{
  flex:1;border:0;background:transparent;outline:none;
  font-family:var(--f-body);font-weight:300;font-size:calc(var(--u)*3.1);color:var(--ink);
}
#q::placeholder{color:var(--olive)}
.qclear{
  border:0;background:transparent;color:var(--olive);cursor:pointer;
  font-size:calc(var(--u)*3.4);line-height:1;display:none;
}
.qclear.on{display:block}
.cats{
  display:flex;gap:calc(var(--u)*1.5);overflow-x:auto;
  padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*1);
  scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;border:1px solid var(--hair);background:transparent;
  border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*3);
  font-family:var(--f-body);font-weight:300;font-size:calc(var(--u)*2.6);
  color:var(--ink-soft);cursor:pointer;transition:all .22s var(--slow);white-space:nowrap;
}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--paper-2);font-weight:400}

/* ---------- ตารางร้าน ---------- */
.grid{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:calc(var(--u)*2);padding:calc(var(--u)*1.5) calc(var(--u)*5) calc(var(--u)*5);
  scrollbar-width:none;
}
.grid::-webkit-scrollbar{display:none}
.card{
  background:var(--paper-2);border:1px solid var(--hair);
  border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.8) calc(var(--u)*1) calc(var(--u)*1.5);
  cursor:pointer;text-align:center;transition:all .22s var(--slow);
}
.card:active{transform:scale(.965)}
.card.on{background:var(--ink);border-color:var(--ink)}
/* กรอบโมโนแกรม — ออกแบบให้วางโลโก้จริงแทนตัวอักษรได้เลยเมื่อของมา */
.mono{
  width:calc(var(--u)*9);height:calc(var(--u)*9);margin:0 auto;
  border-radius:calc(var(--u)*1.2);background:var(--paper-3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:300;font-size:calc(var(--u)*3.2);
  letter-spacing:.05em;color:var(--ink);
}
.card.on .mono{background:rgba(247,244,234,.14);color:var(--paper-2)}
.cname{
  margin-top:calc(var(--u)*1.3);font-size:calc(var(--u)*2.25);font-weight:400;
  line-height:1.3;height:calc(var(--u)*5.9);overflow:hidden;
}
.card.on .cname{color:var(--paper-2)}
.cunit{
  margin-top:calc(var(--u)*.5);font-size:calc(var(--u)*1.9);
  color:var(--olive);letter-spacing:.1em;
}
.card.on .cunit{color:rgba(247,244,234,.55)}
.empty{
  grid-column:1/-1;text-align:center;color:var(--olive);
  font-size:calc(var(--u)*2.8);padding:calc(var(--u)*7) 0;line-height:1.7;
}

/* ---------- แผงรายละเอียดร้าน ---------- */
.detail{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  background:var(--paper-2);border-top:1px solid var(--hair);
  border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0;
  padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*5);
  transform:translateY(102%);transition:transform .42s var(--slow);
  box-shadow:0 calc(var(--u)*-2) calc(var(--u)*6) rgba(35,35,31,.07);
}
.detail.on{transform:translateY(0)}
.dtop{display:flex;align-items:center;gap:calc(var(--u)*2.6)}
.demblem{
  width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:calc(var(--u)*1.5);
  background:var(--paper-3);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:300;font-size:calc(var(--u)*4);flex:0 0 auto;
}
.dname{font-family:var(--f-display);font-weight:400;font-size:calc(var(--u)*4.4);line-height:1.3}
.dkind{font-size:calc(var(--u)*2.5);color:var(--olive);margin-top:calc(var(--u)*.4)}
.dclose{
  margin-left:auto;border:0;background:transparent;color:var(--olive);
  font-family:var(--f-display);font-size:calc(var(--u)*4.6);line-height:1;cursor:pointer;
}
.ddesc{
  margin-top:calc(var(--u)*2.4);font-size:calc(var(--u)*2.8);
  line-height:1.72;color:var(--ink-soft);
}
.dfacts{
  display:flex;gap:calc(var(--u)*2);margin-top:calc(var(--u)*3);
  border-top:1px solid var(--hair);padding-top:calc(var(--u)*2.6);
}
.dfacts div{flex:1}
.dfacts span{
  display:block;font-size:calc(var(--u)*2);color:var(--olive);
  letter-spacing:.13em;
}
.dfacts b{
  display:block;font-family:var(--f-display);font-weight:400;
  font-size:calc(var(--u)*3.2);margin-top:calc(var(--u)*.6);
}
.dgo{
  width:100%;margin-top:calc(var(--u)*3.2);border:0;border-radius:calc(var(--u)*1.6);
  background:var(--ink);color:var(--paper-2);cursor:pointer;
  font-family:var(--f-body);font-weight:400;font-size:calc(var(--u)*3.2);
  padding:calc(var(--u)*2.6) 0;letter-spacing:.03em;
}
.dgo:active{opacity:.86}

/* ---------- แถบล่างสุด ---------- */
.youbar{
  display:flex;align-items:center;gap:calc(var(--u)*1.8);
  padding:calc(var(--u)*2.2) calc(var(--u)*5);
  border-top:1px solid var(--hair);background:var(--paper);
  font-size:calc(var(--u)*2.4);color:var(--ink-soft);
}
.dot{
  width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border-radius:50%;
  background:var(--clay);flex:0 0 auto;
}
.youbar b{font-weight:400;color:var(--ink)}

.toast{
  position:absolute;left:50%;top:calc(var(--u)*4);transform:translate(-50%,-160%);
  background:var(--ink);color:var(--paper-2);border-radius:999px;
  padding:calc(var(--u)*1.6) calc(var(--u)*4);font-size:calc(var(--u)*2.5);
  transition:transform .4s var(--slow);z-index:9;white-space:nowrap;
}
.toast.on{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <header class="head">
    <div class="topline">
      <div class="eyebrow">MyScape · Seacon Square</div>
      <div class="badge">ตัวอย่างระบบ · ชื่อร้านสมมติ</div>
    </div>
    <div class="zone">
      <span class="lvl">1</span>
      <h1>My <b>Pulse</b></h1>
    </div>
    <div class="tag">ที่ที่ของใหม่ขึ้นเวที — เทรนด์ แบรนด์ และอีเวนต์</div>
    <div class="note">ผังลอกจากเอกสารโครงการ ตำแหน่งเป็นค่าประมาณ · ยังไม่ใช่รายชื่อผู้เช่าจริง</div>
  </header>

  <div class="mapwrap">
    <canvas id="view"></canvas>
    <div class="tools">
      <button class="tool" id="rotL" aria-label="หมุนซ้าย">‹</button>
      <button class="tool" id="rotR" aria-label="หมุนขวา">›</button>
      <button class="tool" id="home" aria-label="กลับมุมมองเริ่มต้น">⌂</button>
    </div>
    <div class="hint" id="hint">ลากเพื่อหมุนแผนผัง</div>
  </div>

  <nav class="floors" id="floors"></nav>

  <div class="find">
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="ค้นหาร้าน เช่น รองเท้า กาแฟ" autocomplete="off">
      <button class="qclear" id="qclear" aria-label="ล้างคำค้น">×</button>
    </div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>

  <section class="detail" id="detail" aria-live="polite">
    <div class="dtop">
      <div class="demblem" id="dMono"></div>
      <div>
        <div class="dname" id="dName"></div>
        <div class="dkind" id="dKind"></div>
      </div>
      <button class="dclose" id="dClose" aria-label="ปิด">×</button>
    </div>
    <p class="ddesc" id="dDesc"></p>
    <div class="dfacts">
      <div><span>ยูนิต</span><b id="dUnit"></b></div>
      <div><span>ขนาด</span><b id="dArea"></b></div>
      <div><span>ระยะเดิน</span><b id="dDist"></b></div>
    </div>
    <button class="dgo" id="dGo">พาไปที่ร้าน</button>
  </section>

  <div class="youbar">
    <span class="dot"></span>
    <span>คุณอยู่ที่ <b id="youName">ทางเข้าฝั่งใต้ · ชั้น 1</b></span>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
function $(id){ return document.getElementById(id); }

/* ==================================================================
   1. ข้อมูลผัง — ลอกจาก L1 MY PULSE FLOOR PLAN DIAGRAM ในเด็ค MyScape
      พิกัดเก็บเป็นหน่วยพิกเซลของภาพผังต้นฉบับ แล้วแปลงเป็นเมตรตอนโหลด
      เมื่อได้ไฟล์ DXF ให้แทนที่ทั้งบล็อกนี้บล็อกเดียว ไม่ต้องแตะเรนเดอเรอร์
      ------------------------------------------------------------------
      สเกล 19.3 px ต่อเมตร หาจากการเทียบพื้นที่กล่องยูนิตกับตารางเมตร
      ที่เด็คระบุไว้ 9 ยูนิต ค่ากระจายอยู่ระหว่าง 15.6–25.2 มัธยฐาน 19.27
      แปลว่าตำแหน่งที่ได้คลาดเคลื่อนได้ระดับเมตร ห้ามใช้วัดระยะจริง
   ================================================================== */
var PLAN = { ox:180, oy:60, s:19.3 };
function MX(px){ return (px - PLAN.ox) / PLAN.s; }
function MZ(py){ return (py - PLAN.oy) / PLAN.s; }
function MP(px,py){ return {x:MX(px), z:MZ(py)}; }
function ML(v){ return v / PLAN.s; }

/* ขอบเขตพื้นชั้น */
var PLATE_PX = [[345,140],[2100,140],[2180,215],[3505,1285],[3505,1420],[3465,1790],
                [3120,1885],[640,1885],[640,1565],[185,1525],[185,1300],[345,1245]];

/* โถงกลาง MAIN ATRIUM — ช่องเปิดทะลุชั้นล่าง */
var ATRIUM_PX = [[2130,395],[2185,235],[3500,1290],[3400,1355],[2760,845]];
var VOID_PX   = [[2400,530],[3265,1220],[3175,1288],[2565,700]];

/* พื้นที่สีเขียวและแนวต้นไม้ในผัง */
var GREEN_PX = [
  [[640,1000],[1462,995],[1462,1178],[640,1183]],
  [[255,1215],[1205,1238],[1205,1332],[255,1312]],
  [[2295,1185],[3200,1180],[3200,1282],[2295,1288]]
];
var TREE_PX = [[720,1090],[900,1075],[1090,1090],[1270,1075],[1420,1090],
               [400,1265],[600,1280],[820,1290],[1040,1300],
               [2400,1235],[2620,1228],[2860,1232],[3080,1228]];

/* พื้นจอ LED กลางโซน — ของจริงในผัง เป็นตัวชูโรงของ My Pulse */
var LED_PX = [[1790,1078],[2480,1070],[2515,1215],[1755,1222]];
/* แกนสายตาหลักที่ผังตีเส้นประเหลืองไว้ จาก MUN ผ่านจอ LED ออกโถงกลาง */
var AXIS_PX = [[195,1400],[1755,1150],[2515,1140],[3480,1132]];

/* ทางเข้าออก — ลูกศรแดงในผัง */
var DOORS_PX = [
  {p:[1180,142], n:[0,1],  label:"ทางเข้าเหนือ"},
  {p:[2300,255], n:[-0.6,0.8], label:"ทางเข้าโถงกลาง"},
  {p:[3330,1150],n:[-1,0], label:"ทางเข้าตะวันออก"},
  {p:[1600,1883],n:[0,-1], label:"ทางเข้าใต้"},
  {p:[195,1400], n:[1,0],  label:"เชื่อม MUN x 2"}
];

/* จุดที่ตู้ตั้ง — ตู้แต่ละตัวแก้ค่านี้ทีละตัว */
var YOU_PX = [1600,1620];

/* ---- ยูนิตร้าน 50 ยูนิต 1109–1158 ----

      h: 4.4 + ((parseInt(no,10)*37) % 9) * 0.22,   /* สูงต่างกันเล็กน้อย ไม่ให้แบนราบ */
      pop: 0
    };
    s.corners = cornersOf(s);
    shops.push(s);
  }

  ROWS.forEach(function(r){
    var dx = r.dir[0], dy = r.dir[1];
    var L = Math.hypot(dx,dy); dx/=L; dy/=L;
    var px = -dy, py = dx;              /* ตั้งฉาก ชี้ไปทางความลึกของร้าน */

    var side = r.side || 1;
    px *= side; py *= side;
    var ids = r.list.map(function(e){ return (typeof e === "string") ? e : e[0]; });
    var dps = r.list.map(function(e){ return (typeof e === "string") ? r.dep : e[1]; });
    /* ถ้าใส่ค่าที่สามมา แปลว่าวัดหน้ากว้างจากผังมาตรงๆ ไม่ต้องคำนวณจากตารางเมตร */
    var fw = r.list.map(function(e,i){
      return (typeof e !== "string" && e.length > 2) ? e[2] : frontage(ids[i], dps[i]);
    });
    var sum = fw.reduce(function(a,b){ return a+b; }, 0);
    /* ที่เหลือจากช่วงที่วัดได้ เกลี่ยเป็นร่องระหว่างร้าน ผนังกั้นและช่องงานระบบ */
    var gap = Math.max(2, (r.span - sum) / r.list.length);

    var run = gap/2;
    ids.forEach(function(no, i){
      var ax = r.at[0] + dx*(run + fw[i]/2) + px*(dps[i]/2);
      var ay = r.at[1] + dy*(run + fw[i]/2) + py*(dps[i]/2);
      push(no, MX(ax), MZ(ay), ML(fw[i]), ML(dps[i] - 3), Math.atan2(dy,dx));
      run += fw[i] + gap;
    });
  });

  SOLO.forEach(function(u){
    var w = u.w || (AREA[u.no] * S2 / u.dep);
    push(u.no, MX(u.c[0]), MZ(u.c[1]), ML(w), ML(u.dep - 3), u.rot);
  });

  /* ตาข่ายกันพลาด — บล็อกเฉียงริมโถงกลางในผังจริงเป็นรูปลิ่ม ไม่ใช่สี่เหลี่ยม
     ประมาณเป็นกล่องแล้วยังไงก็มีเบียดกันบ้าง ตรงไหนเบียดให้หดลงทีละนิดจนพ้นกัน
     ผลคือกล่องพวกนั้นเล็กกว่าของจริง ตัวเลขตารางเมตรที่โชว์ในแผงยังเป็นค่าจากผัง */
  resolveOverlap();
})();

function resolveOverlap(){
  function axesOf(c){
    var r = [];
    for(var i=0;i<4;i++){
      var a=c[i], b=c[(i+1)%4], ax=-(b.z-a.z), az=b.x-a.x, l=Math.hypot(ax,az)||1;
      r.push({x:ax/l, z:az/l});
    }
    return r;
  }
  function overlap(A,B){
    var ax = axesOf(A).concat(axesOf(B));
    for(var i=0;i<ax.length;i++){
      var a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;
      for(var k=0;k<4;k++){
        var va=A[k].x*ax[i].x+A[k].z*ax[i].z; if(va<a0)a0=va; if(va>a1)a1=va;
        var vb=B[k].x*ax[i].x+B[k].z*ax[i].z; if(vb<b0)b0=vb; if(vb>b1)b1=vb;
      }
      if(a1 < b0 + 0.08 || b1 < a0 + 0.08) return false;
    }
    return true;
  }
  for(var pass=0; pass<40; pass++){
    var hit = false;
    for(var i=0;i<shops.length;i++){
      for(var j=i+1;j<shops.length;j++){
        if(!overlap(shops[i].corners, shops[j].corners)) continue;
        hit = true;
        [shops[i], shops[j]].forEach(function(s){
          s.w *= 0.985; s.d *= 0.985; s.corners = cornersOf(s);
        });
      }
    }
    if(!hit) break;
  }
}

function cornersOf(s){
  var c = Math.cos(s.rot), n = Math.sin(s.rot);
  var hw = s.w/2, hd = s.d/2;
  /* แกนตามหน้ากว้าง (c,n) แกนตามความลึก (-n,c) */
  return [
    {x:s.cx - c*hw + n*hd, z:s.cz - n*hw - c*hd},
    {x:s.cx + c*hw + n*hd, z:s.cz + n*hw - c*hd},
    {x:s.cx + c*hw - n*hd, z:s.cz + n*hw + c*hd},
    {x:s.cx - c*hw - n*hd, z:s.cz - n*hw + c*hd}
  ];
}

/* ==================================================================
   4. เส้นทางเดิน — กราฟจุดต่อจุด หาทางสั้นที่สุดด้วย Dijkstra
      ผังจริงมีหลายทางเดิน วนรอบเดียวแบบเวอร์ชันศูนย์อาหารใช้ไม่ได้
   ================================================================== */
var NODES = {}, NKEYS = [];
Object.keys(NODES_PX).forEach(function(k){
  NODES[k] = MP(NODES_PX[k][0], NODES_PX[k][1]); NKEYS.push(k);
});
var ADJ = {};
NKEYS.forEach(function(k){ ADJ[k] = []; });
EDGES.forEach(function(e){
  var a = NODES[e[0]], b = NODES[e[1]];
  var w = Math.hypot(b.x-a.x, b.z-a.z);
  ADJ[e[0]].push({to:e[1], w:w});
  ADJ[e[1]].push({to:e[0], w:w});
});

function nearestNode(p){
  var best = null;
  NKEYS.forEach(function(k){
    var d = Math.hypot(NODES[k].x-p.x, NODES[k].z-p.z);
    if(!best || d < best.d) best = {k:k, d:d};
  });
  return best.k;
}
function shortestPath(from, to){
  var dist = {}, prev = {}, seen = {};
  NKEYS.forEach(function(k){ dist[k] = Infinity; });
  dist[from] = 0;
  for(;;){
    var u = null;
    NKEYS.forEach(function(k){
      if(!seen[k] && dist[k] < Infinity && (u === null || dist[k] < dist[u])) u = k;
    });
    if(u === null || u === to) break;
    seen[u] = 1;
    ADJ[u].forEach(function(e){
      if(dist[u] + e.w < dist[e.to]){ dist[e.to] = dist[u] + e.w; prev[e.to] = u; }
    });
  }
  var out = [], cur = to;
  while(cur){ out.unshift(cur); cur = prev[cur]; }
  return (out[0] === from) ? out : [from, to];
}

/* ประตูร้าน = จุดบนขอบร้านที่ใกล้ทางเดินที่สุด */
shops.forEach(function(s){
  var nk = nearestNode({x:s.cx, z:s.cz});
  var n = NODES[nk], best = null;
  for(var i=0;i<4;i++){
    var a = s.corners[i], b = s.corners[(i+1)%4];
    var vx = b.x-a.x, vz = b.z-a.z, L2 = vx*vx+vz*vz;
    var t = Math.max(0, Math.min(1, ((n.x-a.x)*vx + (n.z-a.z)*vz)/L2));
    var q = {x:a.x+vx*t, z:a.z+vz*t};
    var d = Math.hypot(n.x-q.x, n.z-q.z);
    if(!best || d < best.d) best = {d:d, p:q};
  }
  s.door = best.p;
  s.node = nk;
});

var YOU_NODE = nearestNode(YOU);
function buildRoute(s){
  var keys = shortestPath(YOU_NODE, s.node);
  var pts = [{x:YOU.x, z:YOU.z}];
  keys.forEach(function(k){ pts.push({x:NODES[k].x, z:NODES[k].z}); });
  pts.push({x:s.door.x, z:s.door.z});
  /* ตัดจุดที่ซ้อนกันออก */
  var out = [pts[0]];
  for(var i=1;i<pts.length;i++){
    var p = pts[i], q = out[out.length-1];
    if(Math.hypot(p.x-q.x, p.z-q.z) > 0.6) out.push(p);
  }
  return out;
}
function routeLength(r){
  var L = 0;
  for(var i=0;i<r.length-1;i++) L += Math.hypot(r[i+1].x-r[i].x, r[i+1].z-r[i].z);
  return L;
}

/* ==================================================================
   5. เรนเดอเรอร์ 3 มิติ เขียนเอง บน canvas 2 มิติ
      ไม่ใช้ WebGL เพราะมินิพีซีในตู้ห้างมักไม่มีการ์ดจอ
   ================================================================== */
var cv = $("view"), ctx = cv.getContext("2d"), W=0, H=0;

/* หลักป้ายบอกทาง จุด "คุณอยู่ตรงนี้" ต้องอยู่ล่างสุดของจอเสมอ
   เวอร์ชันเดิมตรึงไว้ที่ yaw = PI เพราะตู้อยู่ฝั่งนั้นพอดี
   ผังนี้ตู้ย้ายที่ เลยคำนวณจากตำแหน่งตู้แทน กติกาเดิมจึงบังคับตัวเองได้ */
var FOCUS = {x:(MX(1500)+MX(2400))/2, z:(MZ(700)+MZ(1400))/2};
var HOME = {
  tx:FOCUS.x, tz:FOCUS.z,
  yaw:Math.atan2(YOU.x - FOCUS.x, YOU.z - FOCUS.z),
  pitch:0.74, dist:186
};
var cam = {tx:HOME.tx, tz:HOME.tz, yaw:HOME.yaw, pitch:HOME.pitch, dist:HOME.dist};
var FOV = 0.8;
var eye={x:0,y:0,z:0}, bx={}, by={}, bz={}, focal=1;

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);

function updateCam(){
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  eye.x = cam.tx + cam.dist*cp*Math.sin(cam.yaw);
  eye.y = cam.dist*sp;
  eye.z = cam.tz + cam.dist*cp*Math.cos(cam.yaw);
  var fx = cam.tx-eye.x, fy = -eye.y, fz = cam.tz-eye.z, fl = Math.hypot(fx,fy,fz);
  bz.x=fx/fl; bz.y=fy/fl; bz.z=fz/fl;
  bx.x = -bz.z; bx.y = 0; bx.z = bz.x;   /* = cross(forward, worldUp) — อย่าสลับเครื่องหมาย ภาพจะกลับหัว */
  var rl = Math.hypot(bx.x,bx.z)||1; bx.x/=rl; bx.z/=rl;
  by.x = bx.y*bz.z - bx.z*bz.y;
  by.y = bx.z*bz.x - bx.x*bz.z;
  by.z = bx.x*bz.y - bx.y*bz.x;
  focal = (H/2)/Math.tan(FOV/2);
}
function P(x,y,z){
  var dx=x-eye.x, dy=y-eye.y, dz=z-eye.z;
  var cz = dx*bz.x + dy*bz.y + dz*bz.z;
  if(cz < 0.5) return null;
  return { x: W/2 + focal*(dx*bx.x+dy*bx.y+dz*bx.z)/cz,
           y: H/2 - focal*(dx*by.x+dy*by.y+dz*by.z)/cz, z: cz };
}
function poly(pts, fill, stroke, lw){
  for(var i=0;i<pts.length;i++) if(!pts[i]) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(var j=1;j<pts.length;j++) ctx.lineTo(pts[j].x, pts[j].y);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
function ground(list, y){
  return list.map(function(p){ return P(p.x, y||0, p.z); });
}

/* ==================================================================
   6. สถานะ
   ================================================================== */
var selected = null, cat = "", query = "", route = null, walker = null;
var idleSpin = false, idleTimer = null, flying = null, t0 = performance.now();

function visible(s){
  if(cat && s.cat !== cat) return false;
  if(query){
    var q = query.toLowerCase();
    var hay = (s.name + " " + s.desc + " " + s.no + " " + (CATNAME[s.cat]||"")).toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}

/* ==================================================================
   7. วาดภาพ
   ================================================================== */
function draw(){
  var now = performance.now(), t = (now - t0) / 1000;
  if(idleSpin) cam.yaw += 0.0013;
  if(flying) stepFly();
  shops.forEach(function(s){
    s.pop += (((selected === s) ? 1 : 0) - s.pop) * 0.16;
  });

  updateCam();
  ctx.clearRect(0,0,W,H);

  /* พื้นชั้น */
  poly(ground(PLATE, 0), "#DCD8C7", "rgba(35,35,31,.2)", 1.2);

  /* โถงกลาง เป็นทางเดินกว้างริมช่องเปิด */
  poly(ground(ATRIUM, 0.02), "#E9E5D6", null);
  /* ช่องเปิดทะลุชั้นล่าง วาดเป็นหลุมเข้ม ให้อ่านออกว่าตรงนี้ไม่มีพื้น */
  poly(ground(VOID, 0.03), "rgba(35,35,31,.30)", "rgba(35,35,31,.42)", 1.4);
  /* ราวกันตกรอบช่องเปิด */
  ctx.save(); ctx.strokeStyle = "rgba(35,35,31,.26)"; ctx.lineWidth = 1;
  for(var vi=0; vi<VOID.length; vi++){
    var a = VOID[vi], b = VOID[(vi+1)%VOID.length];
    var a0 = P(a.x,0,a.z), a1 = P(a.x,1.1,a.z), b0 = P(b.x,0,b.z), b1 = P(b.x,1.1,b.z);
    if(a0&&a1&&b0&&b1){
      ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.lineTo(b1.x,b1.y); ctx.stroke();
    }
  }
  ctx.restore();

  /* พื้นที่สีเขียว */
  GREEN.forEach(function(g){ poly(ground(g, 0.04), "#C6D5C9", "rgba(35,35,31,.12)", 1); });
  drawTrees();

  /* แกนสายตาหลักที่ผังตีเส้นประไว้ */
  ctx.save(); ctx.setLineDash([4,9]); ctx.strokeStyle = "rgba(192,112,63,.34)"; ctx.lineWidth = 1.1;
  ctx.beginPath();
  AXIS.forEach(function(p,i){ var q = P(p.x,0.06,p.z); if(!q) return; i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
  ctx.stroke(); ctx.restore();

  drawLED(t);

  if(route) drawRoute();

  /* เรียงจากไกลไปใกล้ แล้ววาดทับกัน */
  var order = shops.map(function(s){
    return {s:s, d:(s.cx-eye.x)*(s.cx-eye.x)+(s.cz-eye.z)*(s.cz-eye.z)};
  }).sort(function(a,b){ return b.d - a.d; });

  var labels = [];
  order.forEach(function(o){ drawShop(o.s, labels); });

  drawEntrances();
  drawYou(t);
  if(walker) drawWalker();
  labels.sort(function(a,b){ return b.z-a.z; }).forEach(drawLabel);
}

function drawTrees(){
  TREES.forEach(function(p){
    var c = P(p.x, 2.6, p.z); if(!c) return;
    var r = Math.max(2, 118/c.z);
    var st = P(p.x, 0, p.z);
    if(st){
      ctx.strokeStyle = "rgba(35,35,31,.3)"; ctx.lineWidth = Math.max(.8, r*0.16);
      ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(c.x, c.y); ctx.stroke();
    }
    ctx.fillStyle = "rgba(122,150,128,.78)";
    ctx.beginPath(); ctx.ellipse(c.x, c.y, r, r*0.82, 0, 0, 6.2832); ctx.fill();
  });
}

/* จอ LED บนพื้น — ของจริงในผัง เป็นจุดเดียวในภาพที่มีสีจัดและเคลื่อนไหว */
function drawLED(t){
  var p = ground(LED, 0.05);
  for(var i=0;i<p.length;i++) if(!p[i]) return;
  var xs = p.map(function(q){ return q.x; }), ys = p.map(function(q){ return q.y; });
  var x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  var y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  var g = ctx.createLinearGradient(x0, y0, x1, y1);
  var k = (t * 0.06) % 1;
  function hue(o){ return "hsl(" + Math.round(((k+o)%1)*360) + ",62%,72%)"; }
  g.addColorStop(0, hue(0)); g.addColorStop(.33, hue(.18));
  g.addColorStop(.66, hue(.42)); g.addColorStop(1, hue(.66));
  ctx.save();
  ctx.globalAlpha = 0.9;
  poly(p, g, null);
  /* แสงสะท้อนบนพื้นรอบจอ */
  ctx.globalAlpha = 0.16;
  var cxp = (x0+x1)/2, cyp = (y0+y1)/2;
  var rg = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, Math.max(x1-x0, y1-y0)*0.75);
  rg.addColorStop(0, hue(.2)); rg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.ellipse(cxp, cyp, (x1-x0)*0.85, (y1-y0)*1.1, 0, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawShop(s, labels){
  var vis = visible(s), sel = (selected === s);
  var lift = s.pop * 2.2;
  var y = (vis ? s.h : s.h*0.42) + lift;
  var c = s.corners;
  var top = [P(c[0].x,y,c[0].z),P(c[1].x,y,c[1].z),P(c[2].x,y,c[2].z),P(c[3].x,y,c[3].z)];
  var bot = [P(c[0].x,0,c[0].z),P(c[1].x,0,c[1].z),P(c[2].x,0,c[2].z),P(c[3].x,0,c[3].z)];

  ctx.globalAlpha = vis ? 1 : 0.26;

  for(var i=0;i<4;i++){
    var a = c[i], b = c[(i+1)%4];
    var nx = -(b.z - a.z), nz = (b.x - a.x);
    var nl = Math.hypot(nx,nz)||1; nx/=nl; nz/=nl;
    if(nx*(eye.x-s.cx) + nz*(eye.z-s.cz) <= 0) continue;       /* หันหลังให้กล้อง ไม่ต้องวาด */
    var lit = 0.62 + 0.38*Math.abs(nx*0.78 + nz*0.34);
    var base = sel ? [58,58,52] : [232,216,180];
    poly([bot[i],bot[(i+1)%4],top[(i+1)%4],top[i]],
      "rgb("+Math.round(base[0]*lit)+","+Math.round(base[1]*lit)+","+Math.round(base[2]*lit)+")",
      "rgba(35,35,31,.38)", 1);
  }
  /* หลังคา ใช้สีเดียวกับกล่องยูนิตในผังสถาปนิก */
  poly(top, sel ? "#23231F" : "#F2DEB6", sel ? "#F7F4EA" : "rgba(35,35,31,.26)", sel ? 2 : 1);

  /* ปากทางเข้าร้าน */
  if(vis && s.door){
    var d0 = P(s.door.x, 0, s.door.z), d1 = P(s.door.x, 2.6, s.door.z);
    if(d0 && d1){
      ctx.strokeStyle = sel ? "rgba(192,112,63,.9)" : "rgba(35,35,31,.28)";
      ctx.lineWidth = sel ? 2.4 : 1.2;
      ctx.beginPath(); ctx.moveTo(d0.x,d0.y); ctx.lineTo(d1.x,d1.y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  if(sel){
    var lp = P(s.cx, y + 5.2, s.cz);
    if(lp) labels.push({x:lp.x, y:lp.y, z:lp.z, name:s.name, no:s.no});
  }
}

function drawLabel(l){
  ctx.save();
  ctx.font = "400 " + Math.max(11, Math.min(19, 620/l.z)) + "px " + "Prompt, sans-serif";
  var w = ctx.measureText(l.name).width;
  var padx = 11, h = 27;
  ctx.fillStyle = "#23231F";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(l.x - w/2 - padx, l.y - h, w + padx*2, h, 13);
  else ctx.rect(l.x - w/2 - padx, l.y - h, w + padx*2, h);
  ctx.fill();
  ctx.fillStyle = "#F7F4EA"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(l.name, l.x, l.y - h/2 + 1);
  /* เข็มชี้ลงไปที่ตึก */
  ctx.strokeStyle = "#23231F"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + 9); ctx.stroke();
  ctx.restore();
}

function drawEntrances(){
  DOORS.forEach(function(d){
    var a = P(d.p.x, 0.4, d.p.z);
    var b = P(d.p.x + d.n.x*4.6, 0.4, d.p.z + d.n.z*4.6);
    if(!a || !b) return;
    ctx.save();
    ctx.strokeStyle = "rgba(35,35,31,.42)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    var ang = Math.atan2(b.y-a.y, b.x-a.x), s = 5.5;
    ctx.fillStyle = "rgba(35,35,31,.42)";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - s*Math.cos(ang-0.45), b.y - s*Math.sin(ang-0.45));
    ctx.lineTo(b.x - s*Math.cos(ang+0.45), b.y - s*Math.sin(ang+0.45));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

function drawRoute(){
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(192,112,63,.24)"; ctx.lineWidth = 9;
  strokeRoute();
  ctx.strokeStyle = "#C0703F"; ctx.lineWidth = 3;
  strokeRoute();
  ctx.restore();
}
function strokeRoute(){
  ctx.beginPath();
  var started = false;
  route.forEach(function(p){
    var q = P(p.x, 0.12, p.z); if(!q) return;
    if(started) ctx.lineTo(q.x, q.y); else { ctx.moveTo(q.x, q.y); started = true; }
  });
  ctx.stroke();
}

function drawYou(t){
  var base = P(YOU.x, 0, YOU.z), tip = P(YOU.x, 7.2, YOU.z);
  if(!base || !tip) return;
  var pulse = 1 + Math.sin(t*1.7)*0.16;
  ctx.save();
  /* วงกระเพื่อมที่พื้น */
  ctx.strokeStyle = "rgba(192,112,63,.34)"; ctx.lineWidth = 1.6;
  var r = Math.max(6, 210/base.z) * pulse;
  ctx.beginPath(); ctx.ellipse(base.x, base.y, r, r*0.44, 0, 0, 6.2832); ctx.stroke();
  /* ก้าน */
  ctx.strokeStyle = "#C0703F"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  /* หัวหมุด */
  ctx.fillStyle = "#C0703F";
  ctx.beginPath(); ctx.arc(tip.x, tip.y, Math.max(4.4, 108/tip.z), 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#EDE9DA";
  ctx.beginPath(); ctx.arc(tip.x, tip.y, Math.max(1.7, 42/tip.z), 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawWalker(){
  var p = P(walker.p.x, 1.1, walker.p.z); if(!p) return;
  ctx.save();
  ctx.fillStyle = "#23231F";
  ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3.2, 74/p.z), 0, 6.2832); ctx.fill();
  ctx.restore();
}

/* ==================================================================
   8. กล้องบินไปหาร้าน
   ================================================================== */
function flyTo(s){
  var yaw = Math.atan2(s.cx - FOCUS.x, s.cz - FOCUS.z);
  /* เลือกทิศหมุนที่สั้นกว่า */
  var d = yaw - cam.yaw;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  flying = {
    t:0,
    from:{tx:cam.tx, tz:cam.tz, yaw:cam.yaw, pitch:cam.pitch, dist:cam.dist},
    to:  {tx:s.cx,   tz:s.cz,   yaw:cam.yaw + d, pitch:0.58, dist:62}
  };
}
function flyHome(){
  var d = HOME.yaw - cam.yaw;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  flying = {
    t:0,
    from:{tx:cam.tx, tz:cam.tz, yaw:cam.yaw, pitch:cam.pitch, dist:cam.dist},
    to:  {tx:HOME.tx, tz:HOME.tz, yaw:cam.yaw + d, pitch:HOME.pitch, dist:HOME.dist}
  };
}
function stepFly(){
  flying.t += 0.028;
  var k = flying.t >= 1 ? 1 : 1 - Math.pow(1 - flying.t, 3);
  var f = flying.from, g = flying.to;
  cam.tx = f.tx + (g.tx-f.tx)*k;
  cam.tz = f.tz + (g.tz-f.tz)*k;
  cam.yaw = f.yaw + (g.yaw-f.yaw)*k;
  cam.pitch = f.pitch + (g.pitch-f.pitch)*k;
  cam.dist = f.dist + (g.dist-f.dist)*k;
  if(flying.t >= 1) flying = null;
}

/* คนเดินตามเส้นทาง */
function startWalker(){
  if(!route || route.length < 2){ walker = null; return; }
  walker = {i:0, t:0, p:{x:route[0].x, z:route[0].z}};
}
function stepWalker(){
  if(!walker || !route) return;
  var a = route[walker.i], b = route[walker.i+1];
  if(!b){ walker.i = 0; walker.t = 0; return; }
  var L = Math.hypot(b.x-a.x, b.z-a.z) || 1;
  walker.t += 0.42 / L;
  if(walker.t >= 1){ walker.t = 0; walker.i++; if(walker.i >= route.length-1) walker.i = 0; return; }
  walker.p = {x:a.x + (b.x-a.x)*walker.t, z:a.z + (b.z-a.z)*walker.t};
}

/* ==================================================================
   9. หน้าจอส่วนล่าง
   ================================================================== */
function renderFloors(){
  $("floors").innerHTML = FLOORS.map(function(f){
    var cls = "fl" + (f.ready ? (f.lvl === "1" ? " on" : "") : " off");
    return '<button class="' + cls + '" data-lvl="' + f.lvl + '">' +
             '<span class="n">L' + f.lvl + '</span>' +
             '<span class="z">' + (f.ready ? f.zone : "เร็วๆ นี้") + '</span>' +
           '</button>';
  }).join("");
  Array.prototype.forEach.call($("floors").children, function(b){
    b.addEventListener("click", function(){
      if(b.className.indexOf("off") >= 0){ toast("ชั้นนี้ยังไม่เปิดใช้งาน"); return; }
    });
  });
}

function renderCats(){
  $("cats").innerHTML = CATS.map(function(c){
    return '<button class="cat' + (c.id === cat ? " on" : "") + '" data-cat="' + c.id + '">' + c.name + '</button>';
  }).join("");
  Array.prototype.forEach.call($("cats").children, function(b){
    b.addEventListener("click", function(){
      cat = b.getAttribute("data-cat");
      renderCats(); renderGrid(); kick();
    });
  });
}

function renderGrid(){
  var list = shops.filter(visible).sort(function(a,b){ return a.no.localeCompare(b.no); });
  if(!list.length){
    $("grid").innerHTML = '<div class="empty">ไม่พบร้านที่ตรงกับที่ค้นหา<br>ลองคำสั้นลง หรือเลือกจากหมวดด้านบน</div>';
    return;
  }
  $("grid").innerHTML = list.map(function(s){
    return '<button class="card' + (selected === s ? " on" : "") + '" data-no="' + s.no + '">' +
             '<div class="mono">' + s.mono + '</div>' +
             '<div class="cname">' + s.name + '</div>' +
             '<div class="cunit">' + s.no + '</div>' +
           '</button>';
  }).join("");
  Array.prototype.forEach.call($("grid").children, function(b){
    if(!b.getAttribute) return;
    b.addEventListener("click", function(){
      var no = b.getAttribute("data-no");
      select(shops.filter(function(s){ return s.no === no; })[0]);
    });
  });
}

function select(s){
  if(!s) return;
  selected = s;
  route = buildRoute(s);
  startWalker();
  flyTo(s);
  $("dMono").textContent = s.mono;
  $("dName").textContent = s.name;
  $("dKind").textContent = CATNAME[s.cat] || "";
  $("dDesc").textContent = s.desc;
  $("dUnit").textContent = s.no;
  $("dArea").textContent = s.area.toFixed(0) + " ตร.ม.";
  $("dDist").textContent = Math.round(routeLength(route)) + " ม.";
  $("detail").className = "detail on";
  renderGrid();
  kick();
}
function deselect(){
  selected = null; route = null; walker = null;
  $("detail").className = "detail";
  flyHome(); renderGrid(); kick();
}

function toast(msg){
  var t = $("toast");
  t.textContent = msg; t.className = "toast on";
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = "toast"; }, 2200);
}

/* ==================================================================
   10. การแตะและลาก
   ================================================================== */
var drag = null;
cv.addEventListener("pointerdown", function(e){
  drag = {x:e.clientX, y:e.clientY, moved:0};
  cv.setPointerCapture(e.pointerId); kick();
});
cv.addEventListener("pointermove", function(e){
  if(!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  cam.yaw -= dx * 0.0072;
  cam.pitch = Math.max(0.28, Math.min(1.24, cam.pitch + dy * 0.0042));
  drag.x = e.clientX; drag.y = e.clientY;
  flying = null;
});
cv.addEventListener("pointerup", function(){ drag = null; });
cv.addEventListener("pointercancel", function(){ drag = null; });

$("rotL").addEventListener("click", function(){ cam.yaw -= 0.42; flying = null; kick(); });
$("rotR").addEventListener("click", function(){ cam.yaw += 0.42; flying = null; kick(); });
$("home").addEventListener("click", function(){ deselect(); });
$("dClose").addEventListener("click", function(){ deselect(); });
$("dGo").addEventListener("click", function(){
  if(!selected) return;
  toast("เส้นทางจากจุดที่คุณอยู่ · " + Math.round(routeLength(route)) + " เมตร");
  startWalker(); kick();
});

$("q").addEventListener("input", function(){
  query = $("q").value.trim();
  $("qclear").className = "qclear" + (query ? " on" : "");
  renderGrid(); kick();
});
$("qclear").addEventListener("click", function(){
  $("q").value = ""; query = ""; $("qclear").className = "qclear";
  renderGrid(); kick();
});

/* ==================================================================
   11. โหมดดึงคน — ไม่มีคนแตะ 60 วินาที กล้องหมุนรอบชั้นช้าๆ
   ================================================================== */
function kick(){
  idleSpin = false;
  $("hint").className = "hint";
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){
    idleSpin = true;
    $("hint").className = "hint gone";
    if(selected) deselect();
    $("q").value = ""; query = ""; cat = "";
    $("qclear").className = "qclear";
    renderCats(); renderGrid();
  }, 60000);
}

/* ==================================================================
   12. เริ่มทำงาน
   ================================================================== */
renderFloors(); renderCats(); renderGrid(); resize(); kick();
setTimeout(function(){ $("hint").className = "hint gone"; }, 7000);

(function loop(){
  stepWalker();
  draw();
  requestAnimationFrame(loop);
})();
</script>
