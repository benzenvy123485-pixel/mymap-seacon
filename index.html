<!DOCTYPE html>
<!-- ฟอนต์ Prompt โดย Cadson Demak · SIL Open Font License 1.1 -->


<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MyScape — แผนผังร้านค้า ตัวอย่างระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* หน่วยฐานของทั้งงาน = 1% ของความกว้างเวที
     บรรทัดแรกใช้ vh ซึ่งเบราว์เซอร์เก่ารู้จัก บรรทัดสองทับด้วย dvh ถ้ารองรับ
     ต้องมีสองบรรทัดเพราะ dvh เพิ่งมาใน Chrome 108 ปลายปี 2022
     มินิพีซีในตู้ห้างมักเป็นเครื่องเก่า ถ้าเหลือบรรทัดเดียวแล้วเบราว์เซอร์ไม่รู้จัก
     ค่าจะกลายเป็นไม่ถูกต้องทั้งตัวแปร แล้วขนาดทุกอย่างที่อิงมันจะพังพร้อมกันหมด */
  --u: min(1vw, 0.5625vh);
  --u: min(1vw, 0.5625dvh);
  /* --u = 1% ของความกว้างเวทีเสมอ ไม่ว่าจอจะสัดส่วนไหน
     เพราะเวทีกว้าง = min(100vw, 100dvh*9/16) ซึ่งเท่ากับ 100 เท่าของค่านี้พอดี */
  --f-display:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --paper:#EDE9DA; --paper-2:#F7F4EA; --paper-3:#E3DFCE;
  --plate:#DCD8C7; --walk:#E9E5D6; --sage:#C6D5C9;
  --clay:#C0703F; --olive:#93937A; --ink:#23231F;
  --ink-soft:rgba(35,35,31,.56); --hair:rgba(35,35,31,.14);
  --slow:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#D6D2C2}
/* จอที่สูงกว่า 9:16 เช่นมือถือรุ่นใหม่ที่เป็น 9:19.5 หรือ 9:20
   เวทีจะถูกยืดสูงเกินสัดส่วนที่ออกแบบไว้ หัวจอกับแผนผังจะเพี้ยน
   จึงล็อกทั้งกว้างและสูง แล้วจัดกลางจอ ส่วนที่เหลือปล่อยเป็นขอบดำรอบ
   ตู้จริงเป็น 9:16 พอดี จะไม่เห็นขอบเลย */
body{display:flex;align-items:center;justify-content:center}
body{font-family:var(--f-body);font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{
  position:relative;
  width:min(100vw, calc(100dvh * 9 / 16));
  height:min(100dvh, calc(100vw * 16 / 9));
  flex:0 0 auto;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
}

.head{padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*1.8)}
.topline{display:flex;align-items:center;gap:calc(var(--u)*2.2);flex-wrap:wrap}
.eyebrow{font-size:calc(var(--u)*2.05);font-weight:300;letter-spacing:.4em;
  text-transform:uppercase;color:var(--olive)}
.badge{border:1px solid var(--clay);color:var(--clay);border-radius:999px;
  padding:calc(var(--u)*.65) calc(var(--u)*1.9);font-size:calc(var(--u)*1.85);letter-spacing:.1em;white-space:nowrap}
.zone{display:flex;align-items:baseline;gap:calc(var(--u)*2.4);margin-top:calc(var(--u)*1)}
.zone .lvl{font-family:var(--f-display);font-weight:200;font-size:calc(var(--u)*4.2);
  color:var(--clay);letter-spacing:.06em}
.zone h1{font-family:var(--f-display);font-weight:200;font-size:calc(var(--u)*7.6);letter-spacing:-.005em;line-height:1}
.zone h1 b{font-weight:500}
.tag{margin-top:calc(var(--u)*1.1);font-size:calc(var(--u)*2.7);color:var(--ink-soft)}

.mapwrap{position:relative;flex:0 0 auto;height:39dvh}
#view{width:100%;height:100%;display:block;touch-action:none}
.tools{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3);
  display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
.tool{width:calc(var(--u)*7.6);height:calc(var(--u)*7.6);border-radius:50%;
  border:1px solid var(--hair);background:rgba(247,244,234,.88);color:var(--ink);
  font-size:calc(var(--u)*3.4);font-family:var(--f-display);font-weight:300;cursor:pointer;
  line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s var(--slow)}
.tool:active{background:var(--paper-3)}
.hint{position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*3.6);
  font-size:calc(var(--u)*2.1);color:var(--olive);letter-spacing:.14em;transition:opacity .6s var(--slow)}
.hint.gone{opacity:0}

.floors{display:flex;gap:calc(var(--u)*1.3);padding:calc(var(--u)*2.2) calc(var(--u)*5) calc(var(--u)*1.6)}
.fl{flex:1;border:1px solid var(--hair);background:transparent;border-radius:calc(var(--u)*1.3);
  padding:calc(var(--u)*1.5) 0 calc(var(--u)*1.4);cursor:pointer;font-family:var(--f-body);text-align:center;
  transition:all .25s var(--slow)}
.fl .n{display:block;font-family:var(--f-display);font-weight:300;font-size:calc(var(--u)*2.2);
  letter-spacing:.2em;color:var(--olive)}
.fl .z{display:block;font-size:clamp(10px, calc(var(--u)*2.45), 22px);font-weight:400;margin-top:calc(var(--u)*.4);color:var(--ink-soft)}
.fl.on{background:var(--ink);border-color:var(--ink)}
.fl.on .n{color:rgba(247,244,234,.6)} .fl.on .z{color:var(--paper-2)}

.find{padding:0 calc(var(--u)*5) calc(var(--u)*1.6)}
.searchbox{display:flex;align-items:center;gap:calc(var(--u)*1.8);background:var(--paper-3);
  border-radius:calc(var(--u)*1.5);padding:calc(var(--u)*1.9) calc(var(--u)*2.6)}
.searchbox svg{flex:0 0 auto;opacity:.5}
#q{flex:1;border:0;background:transparent;outline:none;font-family:var(--f-body);
  font-weight:300;font-size:clamp(13px, calc(var(--u)*2.95), 30px);color:var(--ink)}
#q::placeholder{color:var(--olive)}
.qclear{border:0;background:transparent;color:var(--olive);cursor:pointer;font-size:calc(var(--u)*3.2);line-height:1;display:none}
.qclear.on{display:block}
.scope{margin-top:calc(var(--u)*1.2);font-size:clamp(10px, calc(var(--u)*2.15), 20px);color:var(--olive)}
.scope b{font-weight:400;color:var(--clay)}

/* แถบหมวด ตัดปัญหาด้วยการขึ้นบรรทัดใหม่ ไม่ใช่การเลื่อน
   สิบปุ่มเรียงแถวเดียวกว้างราวสองเท่าของจอ เกินครึ่งจะอยู่นอกจอ
   ถ้าใช้การเลื่อน ตู้ที่ต่อเมาส์จะเลื่อนไม่ได้เลยเพราะล้อเมาส์ไม่เลื่อนแนวนอน
   และคนที่เดินมาใช้ก็ไม่มีทางรู้ว่ามีปุ่มซ่อนอยู่ทางขวา
   ขึ้นบรรทัดใหม่แปลว่าทุกปุ่มอยู่ในจอเสมอ กดได้ทุกปุ่ม ไม่ต้องค้นหา */
.cats{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.3);
  padding:calc(var(--u)*1.4) calc(var(--u)*5) calc(var(--u)*.8)}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:calc(var(--u)*1.1);
  border:1px solid var(--hair);background:transparent;border-radius:999px;
  padding:calc(var(--u)*1.15) calc(var(--u)*2.1);font-family:var(--f-body);font-weight:300;
  min-height:34px;
  font-size:clamp(11px, calc(var(--u)*2.5), 24px);color:var(--ink-soft);cursor:pointer;transition:all .22s var(--slow);white-space:nowrap}
.cat i{width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;display:block}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--paper-2);font-weight:400}

.grid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;
  grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.7);
  align-content:start;
  padding:calc(var(--u)*1.4) calc(var(--u)*5) calc(var(--u)*5);scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
/* การ์ดเป็น div ไม่ใช่ button เพราะ button มีสไตล์ของเบราว์เซอร์ติดมา
   และบางเบราว์เซอร์จัดเลย์เอาต์ข้างในปุ่มไม่เหมือนกล่องธรรมดา
   ความสูงคุมด้วย aspect-ratio กับ min-height เป็นพิกเซล ไม่ได้เกิดจากการบวกความสูงลูกทีละชั้น
   ต่อให้ค่าใดค่าหนึ่งข้างในเพี้ยน การ์ดก็ยังไม่ยุบ */
/* ---- หัวเซกชันหมวดในตารางร้าน ---- */
.sechead{
  grid-column:1/-1;display:flex;align-items:baseline;gap:calc(var(--u)*1.6);
  margin-top:calc(var(--u)*2.2);margin-bottom:calc(var(--u)*.2);
  padding-bottom:calc(var(--u)*1);border-bottom:1px solid var(--hair);
}
.sechead:first-child{margin-top:0}
.sechead i{width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);min-width:8px;min-height:8px;
  border-radius:50%;display:block;flex:0 0 auto;align-self:center}
.sechead h3{font-family:var(--f-display);font-weight:400;
  font-size:clamp(12px, calc(var(--u)*2.9), 26px);letter-spacing:.01em;color:var(--ink)}
.sechead span{margin-left:auto;font-size:clamp(9px, calc(var(--u)*2), 18px);color:var(--olive)}
.card{
  background:var(--paper-2);border:1px solid var(--hair);
  border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*1.6) calc(var(--u)*.8) calc(var(--u)*1.2);
  cursor:pointer;text-align:center;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  aspect-ratio:1/1.06;min-height:72px;
  transition:background .22s var(--slow),border-color .22s var(--slow),transform .22s var(--slow);
  -webkit-user-select:none;user-select:none;
}
.card:active{transform:scale(.965)}
.card.on{background:var(--ink);border-color:var(--ink)}
.card .bar{position:absolute;left:0;top:0;width:100%;height:4px}
.mono{
  width:34%;aspect-ratio:1/1;flex:0 0 auto;border-radius:calc(var(--u)*1.1);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(11px, calc(var(--u)*2.6), 30px);
  letter-spacing:.03em;color:var(--ink);
}
.card.on .mono{color:var(--paper-2)}
/* ชื่อร้านตัดที่สามบรรทัด ใช้ min-height กันการ์ดเต้นตอนชื่อสั้นยาวไม่เท่ากัน
   แต่ไม่ล็อก height ตายตัว ถ้าชื่อยาวกว่าที่คิดจะได้ไม่ถูกตัดหาย */
.cname{
  margin-top:calc(var(--u)*1.1);
  font-size:clamp(10px, calc(var(--u)*2.15), 24px);
  font-weight:400;line-height:1.3;
  min-height:2.6em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.card.on .cname{color:var(--paper-2)}
.cunit{
  margin-top:auto;padding-top:calc(var(--u)*.4);
  font-size:clamp(9px, calc(var(--u)*1.7), 18px);
  color:var(--olive);letter-spacing:.06em;
}
.card.on .cunit{color:rgba(247,244,234,.55)}
.empty{grid-column:1/-1;text-align:center;color:var(--olive);font-size:calc(var(--u)*2.7);
  padding:calc(var(--u)*6) 0;line-height:1.7}

.detail{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--paper-2);
  border-top:1px solid var(--hair);border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0;
  padding:calc(var(--u)*3.6) calc(var(--u)*5) calc(var(--u)*4.6);
  transform:translateY(102%);transition:transform .42s var(--slow);
  box-shadow:0 calc(var(--u)*-2) calc(var(--u)*6) rgba(35,35,31,.07)}
.detail.on{transform:translateY(0)}
.dtop{display:flex;align-items:center;gap:calc(var(--u)*2.4)}
.demblem{width:calc(var(--u)*10.5);height:calc(var(--u)*10.5);border-radius:calc(var(--u)*1.4);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);
  font-weight:300;font-size:calc(var(--u)*3.8);flex:0 0 auto}
.dname{font-family:var(--f-display);font-weight:400;font-size:calc(var(--u)*4.2);line-height:1.3}
.dkind{font-size:calc(var(--u)*2.4);color:var(--olive);margin-top:calc(var(--u)*.3)}
.dclose{margin-left:auto;border:0;background:transparent;color:var(--olive);
  font-family:var(--f-display);font-size:calc(var(--u)*4.4);line-height:1;cursor:pointer}
.ddesc{margin-top:calc(var(--u)*2.1);font-size:clamp(12px, calc(var(--u)*2.7), 26px);line-height:1.7;color:var(--ink-soft)}
/* ---- รายการแนะนำ ---- */
.dpicks{margin-top:calc(var(--u)*2.6);border-top:1px solid var(--hair);padding-top:calc(var(--u)*2.4)}
.dpicks h4{font-family:var(--f-display);font-weight:400;font-size:clamp(11px, calc(var(--u)*2.5), 24px);
  letter-spacing:.02em;color:var(--olive);margin-bottom:calc(var(--u)*1.6)}
/* สามรายการเรียงข้างกันเสมอ ไม่ว่าจอกว้างแค่ไหน
   ถ้าปล่อยให้เรียงลงมาแนวตั้ง ภาพจะใหญ่เต็มความกว้างจนแผงยาวเกินครึ่งจอ */
.picks{display:flex;flex-direction:row;gap:calc(var(--u)*1.8);align-items:flex-start}
.pick{flex:1 1 0;min-width:0;max-width:33.4%}
.pshot{display:block;width:100%;aspect-ratio:4/3;border-radius:calc(var(--u)*1.2);
  overflow:hidden;background:var(--paper-3)}
.pshot canvas{display:block;width:100%;height:100%}
.pname{margin-top:calc(var(--u)*1);font-size:clamp(10px, calc(var(--u)*2.15), 22px);
  line-height:1.35;min-height:2.7em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word}
/* ---- แถบเส้นทางในแผงรายละเอียด ---- */

.rrow{display:flex;align-items:center;gap:calc(var(--u)*1.6);margin-bottom:calc(var(--u)*1.2)}
.rlabel{flex:0 0 auto;width:calc(var(--u)*5);font-size:clamp(10px, calc(var(--u)*2.1), 20px);color:var(--olive)}
.rpick{flex:1;text-align:left;border:1px solid var(--hair);background:var(--paper);
  border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.4) calc(var(--u)*2);
  font-family:var(--f-body);font-weight:400;font-size:clamp(11px, calc(var(--u)*2.4), 22px);
  color:var(--ink);cursor:pointer;min-height:34px}
.rpick:active{background:var(--paper-3)}
.rpick::after{content:" ▾";color:var(--olive)}
.rto{flex:1;font-weight:400;font-size:clamp(11px, calc(var(--u)*2.4), 22px);color:var(--ink)}
.dgo{width:100%;margin-top:calc(var(--u)*1.4);border:0;border-radius:calc(var(--u)*1.4);
  background:var(--ink);color:var(--paper-2);cursor:pointer;font-family:var(--f-body);
  font-weight:400;font-size:clamp(12px, calc(var(--u)*2.9), 26px);
  padding:calc(var(--u)*2.2) 0;letter-spacing:.02em;min-height:42px}
.dgo:active{opacity:.86}

/* ---- การ์ดลอยทับแผนที่ ตอนถึงจุดสำคัญ ----
   ใช้เฉพาะขั้นข้ามชั้นและขั้นสุดท้าย เพราะเป็นสองจุดที่คนหลงมากที่สุด
   ถ้าขึ้นทุกขั้นจะบังแผนที่ตลอดเวลาแล้วไม่มีใครสนใจ */
.fcard{
  position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:calc(var(--u)*7);
  display:flex;align-items:center;gap:calc(var(--u)*2.6);
  background:var(--paper-2);border-radius:calc(var(--u)*2.4);
  padding:calc(var(--u)*2.6) calc(var(--u)*3);
  box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*4) rgba(35,35,31,.18);
  opacity:0;transform:translateY(calc(var(--u)*-2));pointer-events:none;
  transition:opacity .3s var(--slow),transform .3s var(--slow);
}
.fcard.on{opacity:1;transform:translateY(0)}
.ficon{flex:0 0 auto;width:calc(var(--u)*11);height:calc(var(--u)*11);min-width:44px;min-height:44px;
  border-radius:calc(var(--u)*1.6);background:var(--paper-3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:400;font-size:clamp(18px, calc(var(--u)*5), 44px);color:var(--clay)}
.fbody{min-width:0}
.fhead{font-family:var(--f-display);font-weight:500;
  font-size:clamp(14px, calc(var(--u)*4), 34px);line-height:1.2;color:var(--ink)}
.fhead em{font-style:normal;color:var(--clay)}
.ftext{margin-top:calc(var(--u)*.6);font-size:clamp(11px, calc(var(--u)*2.5), 22px);color:var(--ink-soft)}

/* ---- ที่จับลากแผงขั้นตอน ---- */
.grip{width:calc(var(--u)*11);height:4px;border-radius:2px;background:var(--paper-3);
  margin:0 auto calc(var(--u)*2);cursor:grab}

/* ---- ไทม์ไลน์แบบจุดต่อเส้น ---- */
.timeline{display:flex;align-items:center;margin-top:calc(var(--u)*2.6)}
.timeline .tnode{flex:0 0 auto;width:calc(var(--u)*4);height:calc(var(--u)*4);
  min-width:18px;min-height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper-3);color:var(--olive);
  font-size:clamp(8px, calc(var(--u)*1.9), 16px);line-height:1}
.timeline .tnode.done{background:var(--clay);color:var(--paper-2);opacity:.45}
.timeline .tnode.now{background:var(--clay);color:var(--paper-2);
  box-shadow:0 0 0 calc(var(--u)*1) rgba(192,112,63,.22)}
.timeline .tnode.end{background:var(--ink);color:var(--paper-2)}
.timeline .tseg{flex:1;height:3px;border-radius:2px;background:var(--paper-3)}
.timeline .tseg.done{background:var(--clay);opacity:.45}

/* ---- รายการขั้นตอนทั้งหมด โผล่เมื่อลากแผงขึ้น ---- */
.slist{max-height:0;overflow:hidden;transition:max-height .38s var(--slow)}
.steps.tall .slist{max-height:34dvh;overflow-y:auto;margin-top:calc(var(--u)*2.4);
  border-top:1px solid var(--hair);padding-top:calc(var(--u)*1.6)}
.sitem{display:flex;gap:calc(var(--u)*2);padding:calc(var(--u)*1.5) 0;cursor:pointer;
  border-bottom:1px solid var(--hair)}
.sitem:last-child{border-bottom:0}
.sitem b{flex:0 0 auto;width:calc(var(--u)*4.4);min-width:20px;text-align:center;
  font-family:var(--f-display);font-weight:400;color:var(--olive);
  font-size:clamp(10px, calc(var(--u)*2.2), 20px)}
.sitem span{font-size:clamp(10px, calc(var(--u)*2.4), 21px);line-height:1.45;color:var(--ink-soft)}
.sitem.now b{color:var(--clay)}
.sitem.now span{color:var(--ink)}

/* ---- popup นำทาง ----
   เดิมเป็นแถบถาวรใต้แผนผัง แต่หน้าจอมีแถบแนวนอนซ้อนกันถึงเจ็ดชั้นอยู่แล้ว
   คือ หัวจอ แผนผัง แถบนำทาง แถบชั้น ช่องค้นหา ปุ่มหมวด ตารางร้าน
   เพิ่มอีกแถบแล้วอ่านไม่ออกว่าอะไรเป็นอะไร จึงย้ายมาเป็นหน้าต่างเด้ง
   เรียกจากปุ่มบนแผนผังหรือจากปุ่มในแผงร้าน */
.veil{position:absolute;inset:0;background:rgba(35,35,31,.32);z-index:9;
  opacity:0;pointer-events:none;transition:opacity .3s var(--slow)}
.veil.on{opacity:1;pointer-events:auto}
.rdlg{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(var(--u)*10);
  z-index:10;background:var(--paper-2);border-radius:calc(var(--u)*2.6);
  padding:calc(var(--u)*3.4) calc(var(--u)*3.6) calc(var(--u)*3.6);
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*7) rgba(35,35,31,.24);
  opacity:0;transform:translateY(calc(var(--u)*4)) scale(.97);pointer-events:none;
  transition:opacity .3s var(--slow),transform .3s var(--slow)}
.rdlg.on{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.rdhead{display:flex;align-items:center;margin-bottom:calc(var(--u)*2.2)}
.rdhead span{flex:1;font-family:var(--f-display);font-weight:400;
  font-size:clamp(13px, calc(var(--u)*3.2), 28px);color:var(--ink)}

/* ---- ปุ่มนำทางลอยบนแผนผัง ---- */
.navbtn{position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*3.4);
  display:flex;align-items:center;gap:calc(var(--u)*1.4);
  border:1px solid var(--hair);background:rgba(247,244,234,.92);
  border-radius:999px;padding:calc(var(--u)*1.5) calc(var(--u)*3);
  font-family:var(--f-body);font-weight:400;font-size:clamp(11px, calc(var(--u)*2.4), 21px);
  color:var(--ink);cursor:pointer;min-height:36px}
.navbtn:active{background:var(--paper-3)}
.stage.navi .navbtn{display:none}

/* ---- ท้ายแผงร้าน ---- */
.dfoot{margin-top:calc(var(--u)*2.4);border-top:1px solid var(--hair);padding-top:calc(var(--u)*2)}
.dway2{font-size:clamp(11px, calc(var(--u)*2.5), 22px);color:var(--ink);
  background:var(--paper-3);border-radius:calc(var(--u)*1.3);
  padding:calc(var(--u)*1.6) calc(var(--u)*2.2);line-height:1.6}
.dway2 b{font-weight:500;color:var(--clay)}
.dbtns{display:flex;gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*1.6)}
.dbtns .dgo{flex:1.6;margin-top:0}
.dghost{flex:1;border:1px solid var(--hair);background:transparent;
  border-radius:calc(var(--u)*1.4);color:var(--ink);cursor:pointer;
  font-family:var(--f-body);font-weight:400;font-size:clamp(11px, calc(var(--u)*2.5), 22px);
  padding:calc(var(--u)*2.2) 0;min-height:42px}
.dghost:active{background:var(--paper-3)}

/* ---- ช่องต้นทาง–ปลายทาง แบบสองช่องมีปุ่มสลับ ---- */
.rfields{display:flex;align-items:stretch;gap:calc(var(--u)*2)}
.rdots{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(var(--u)*2.2) 0}
.rd{width:calc(var(--u)*2);height:calc(var(--u)*2);min-width:9px;min-height:9px;border-radius:50%;display:block}
.rd.o{border:2px solid var(--olive);background:transparent}
.rd.d{background:var(--clay)}
.rl{flex:1;width:2px;background:var(--hair);margin:calc(var(--u)*.6) 0}
.rcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
.rpick{width:100%;text-align:left;border:1px solid var(--hair);background:var(--paper);
  border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.5) calc(var(--u)*2);
  font-family:var(--f-body);font-weight:400;font-size:clamp(11px, calc(var(--u)*2.4), 22px);
  color:var(--ink);cursor:pointer;min-height:36px;
  display:flex;align-items:center;gap:calc(var(--u)*1);overflow:hidden}
.rpick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpick span.ph{color:var(--olive)}
.rpick::after{content:"▾";color:var(--olive);flex:0 0 auto}
.rpick:active{background:var(--paper-3)}
.rswap{flex:0 0 auto;align-self:center;width:calc(var(--u)*7);height:calc(var(--u)*7);
  min-width:32px;min-height:32px;border-radius:50%;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);cursor:pointer;
  font-family:var(--f-display);font-size:calc(var(--u)*3.2);line-height:1}
.rswap:disabled{opacity:.3;cursor:default}
.rswap:active{background:var(--paper-3)}

/* ---- แผงเลือกร้าน ดันขึ้นจากล่างเหมือนแผงขั้นตอน ---- */
.rpanel{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--paper-2);
  border-top:1px solid var(--hair);border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0;
  padding:calc(var(--u)*2.4) calc(var(--u)*5) calc(var(--u)*4);
  transform:translateY(102%);transition:transform .4s var(--slow);
  box-shadow:0 calc(var(--u)*-2) calc(var(--u)*6) rgba(35,35,31,.12)}
.rpanel.on{transform:translateY(0)}
.rphead{display:flex;align-items:center;margin-bottom:calc(var(--u)*1.8)}
.rphead span{flex:1;font-family:var(--f-display);font-weight:400;
  font-size:clamp(12px, calc(var(--u)*3), 26px);color:var(--ink)}
.rpbox{margin-bottom:calc(var(--u)*1.6)}
.rplist{max-height:44dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.rplist::-webkit-scrollbar{display:none}
.ritem{display:flex;align-items:center;gap:calc(var(--u)*2);width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--hair);background:transparent;
  padding:calc(var(--u)*1.8) calc(var(--u)*.5);cursor:pointer;min-height:44px}
.ritem:last-child{border-bottom:0}
.ritem:active{background:var(--paper-3)}
.rimono{flex:0 0 auto;width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);
  min-width:28px;min-height:28px;border-radius:calc(var(--u)*1);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(9px, calc(var(--u)*2.1), 18px);color:var(--ink)}
.ribody{flex:1;min-width:0}
.riname{font-size:clamp(11px, calc(var(--u)*2.5), 22px);font-weight:400;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rimeta{margin-top:calc(var(--u)*.3);font-size:clamp(9px, calc(var(--u)*2), 18px);color:var(--olive)}
.riflag{flex:0 0 auto;font-size:clamp(9px, calc(var(--u)*1.9), 17px);color:var(--clay)}
.rpempty{text-align:center;color:var(--olive);padding:calc(var(--u)*5) 0;
  font-size:clamp(10px, calc(var(--u)*2.5), 22px);line-height:1.7}

/* ---- แผงขั้นตอน ---- */
.steps{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--paper-2);
  border-top:1px solid var(--hair);border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0;
  padding:calc(var(--u)*3) calc(var(--u)*5) calc(var(--u)*4);
  transform:translateY(102%);transition:transform .42s var(--slow);
  box-shadow:0 calc(var(--u)*-2) calc(var(--u)*6) rgba(35,35,31,.09)}
.steps.on{transform:translateY(0)}
/* อยู่ในโหมดนำทาง แผนที่โตขึ้นเต็มที่ เพราะแผนที่คือสิ่งที่คนต้องดู
   ตารางร้านข้างล่างถูกแผงขั้นตอนบังอยู่แล้ว ไม่ต้องกันที่ให้ */
.stage.navi .mapwrap{height:62dvh}
.sbar{display:flex;align-items:center;gap:calc(var(--u)*2)}
.snav{width:calc(var(--u)*7);height:calc(var(--u)*7);min-width:30px;min-height:30px;
  border-radius:50%;border:1px solid var(--hair);background:var(--paper);
  font-family:var(--f-display);font-size:calc(var(--u)*3.4);line-height:1;color:var(--ink);cursor:pointer}
.snav:disabled{opacity:.3;cursor:default}
.scount{flex:1;text-align:center;font-size:clamp(11px, calc(var(--u)*2.5), 22px);color:var(--ink-soft)}
.scount b{font-family:var(--f-display);font-weight:500;color:var(--ink);font-size:1.15em}
.sclose{border:0;background:transparent;color:var(--olive);font-family:var(--f-display);
  font-size:calc(var(--u)*4);line-height:1;cursor:pointer}
.stext{margin-top:calc(var(--u)*2.2);font-size:clamp(13px, calc(var(--u)*3.4), 30px);
  font-weight:400;line-height:1.5;color:var(--ink)}
.stext b{font-weight:500;color:var(--clay)}
.stext .esc{display:inline-flex;align-items:center;gap:calc(var(--u)*1.2);
  background:var(--paper-3);border-radius:calc(var(--u)*1.2);
  padding:calc(var(--u)*.9) calc(var(--u)*1.8);margin-right:calc(var(--u)*1)}
.ssub{margin-top:calc(var(--u)*.9);font-size:clamp(10px, calc(var(--u)*2.3), 20px);color:var(--olive)}

.dway{margin-top:calc(var(--u)*1.6);font-size:calc(var(--u)*2.5);color:var(--ink);
  background:var(--paper-3);border-radius:calc(var(--u)*1.3);padding:calc(var(--u)*1.8) calc(var(--u)*2.2);line-height:1.6}
.dway b{font-weight:500;color:var(--clay)}

.youbar{display:flex;align-items:center;gap:calc(var(--u)*1.6);
  padding:calc(var(--u)*2) calc(var(--u)*5);border-top:1px solid var(--hair);
  background:var(--paper);font-size:calc(var(--u)*2.3);color:var(--ink-soft)}
.dot{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-radius:50%;background:var(--clay);flex:0 0 auto}
.youbar b{font-weight:400;color:var(--ink)}
.toast{position:absolute;left:50%;top:calc(var(--u)*4);transform:translate(-50%,-160%);
  background:var(--ink);color:var(--paper-2);border-radius:999px;
  padding:calc(var(--u)*1.5) calc(var(--u)*3.6);font-size:calc(var(--u)*2.4);
  transition:transform .4s var(--slow);z-index:9;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="head">
    <div class="topline">
      <div class="eyebrow">MyScape · Seacon Square</div>
      <div class="badge">ตัวอย่างระบบ · ชื่อร้านสมมติ</div>
    </div>
    <div class="zone"><span class="lvl" id="hLvl">1</span><h1 id="hZone"></h1></div>
    <div class="tag" id="hTag"></div>
  </header>
  <div class="mapwrap">
    <canvas id="view"></canvas>
    <div class="tools">
      <button class="tool" id="zin"  aria-label="ซูมเข้า">+</button>
      <button class="tool" id="zout" aria-label="ซูมออก">−</button>
      <button class="tool" id="rotL" aria-label="หมุนซ้าย">‹</button>
      <button class="tool" id="rotR" aria-label="หมุนขวา">›</button>
      <button class="tool" id="home" aria-label="กลับมุมมองเริ่มต้น">⌂</button>
    </div>
    <div class="hint" id="hint">จิ้มที่ร้านเพื่อดูรายละเอียด · ลากเพื่อหมุน</div>
    <button class="navbtn" id="navBtn">⇄ นำทางจากร้านอื่น</button>
    <div class="fcard" id="fCard">
      <div class="ficon" id="fIcon"></div>
      <div class="fbody"><div class="fhead" id="fHead"></div><div class="ftext" id="fText"></div></div>
    </div>
  </div>

  <nav class="floors" id="floors"></nav>
  <div class="find">
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="ค้นหาร้าน เช่น กาแฟ รองเท้า" autocomplete="off">
      <button class="qclear" id="qclear" aria-label="ล้างคำค้น">×</button>
    </div>
    <div class="scope" id="scope"></div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <section class="detail" id="detail" aria-live="polite">
    <div class="dtop">
      <div class="demblem" id="dMono"></div>
      <div><div class="dname" id="dName"></div><div class="dkind" id="dKind"></div></div>
      <button class="dclose" id="dClose" aria-label="ปิด">×</button>
    </div>
    <p class="ddesc" id="dDesc"></p>
    <div class="dpicks">
      <h4 id="dPickTitle">เมนูแนะนำ</h4>
      <div class="picks" id="dPicks"></div>
    </div>
    <div class="dfoot">
      <div class="dway2" id="dWay2"></div>
      <div class="dbtns">
        <button class="dghost" id="dFrom">เปลี่ยนต้นทาง</button>
        <button class="dgo" id="dGo2">ดูขั้นตอนการเดิน</button>
      </div>
    </div>
  </section>

  <div class="veil" id="veil"></div>
  <section class="rdlg" id="rDlg" aria-live="polite">
    <div class="rdhead">
      <span>นำทาง</span>
      <button class="sclose" id="rdClose" aria-label="ปิด">×</button>
    </div>
    <div class="rfields">
      <div class="rdots"><span class="rd o"></span><span class="rl"></span><span class="rd d"></span></div>
      <div class="rcol">
        <button class="rpick" id="rFrom"><span>จุดที่คุณยืน</span></button>
        <button class="rpick" id="rTo"><span class="ph">เลือกร้านปลายทาง</span></button>
      </div>
      <button class="rswap" id="rSwap" aria-label="สลับต้นทางปลายทาง">⇅</button>
    </div>
    <div class="dway" id="dWay"></div>
    <button class="dgo" id="dSteps">เริ่มนำทาง</button>
  </section>

  <section class="rpanel" id="rPanel" aria-live="polite">
    <div class="grip"></div>
    <div class="rphead">
      <span id="rpTitle">เลือกร้านต้นทาง</span>
      <button class="sclose" id="rpClose" aria-label="ปิด">×</button>
    </div>
    <div class="searchbox rpbox">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M11 11l4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input id="rpQ" type="search" placeholder="พิมพ์ชื่อร้าน หรือ หมวด" autocomplete="off">
      <button class="qclear" id="rpClear" aria-label="ล้าง">×</button>
    </div>
    <div class="rplist" id="rpList"></div>
  </section>

  <section class="steps" id="steps" aria-live="polite">
    <div class="grip" id="sGrip"></div>
    <div class="sbar">
      <button class="snav" id="sPrev" aria-label="ขั้นก่อนหน้า">‹</button>
      <div class="scount">ขั้นตอน <b id="sNum">1</b>/<span id="sTot">1</span></div>
      <button class="snav" id="sNext" aria-label="ขั้นถัดไป">›</button>
      <button class="sclose" id="sClose" aria-label="ปิด">×</button>
    </div>
    <div class="stext" id="sText"></div>
    <div class="ssub" id="sSub"></div>
    <div class="timeline" id="sLine"></div>
    <div class="slist" id="sList"></div>
  </section>
  <div class="youbar"><span class="dot"></span><span id="youName"></span></div>
  <div class="toast" id="toast"></div>
</div>
<script>

                        2.6 เมตรพอให้เห็นขอบพื้น แต่แคบกว่ากันชนรอบร้าน จึงเดินไม่ได้ */

function buildFloor(f){
  var s = f.s, ox = 1e9, oy = 1e9;
  f.units.forEach(function(u){ ox = Math.min(ox, u[1]); oy = Math.min(oy, u[2]); });
  ox -= 260; oy -= 260;
  f.M = function(px,py){ return {x:(px-ox)/s, z:(py-oy)/s}; };

  f.shops = f.units.map(function(u){
    var c = f.M(u[1], u[2]);
    var sh = {no:u[0], cx:c.x, cz:c.z, w:u[3]/s, d:u[4]/s, rot:u[5],
              /* ความสูงตึกไม่ใช่ความสูงจริงของชั้น สูงจริงราว 5 เมตร
                 แต่พอฉายลงจอ 9:16 ที่ต้องเห็นทั้งชั้น ตึกจะเหลือ 15 พิกเซล ดูเป็นเส้นขีด
                 จึงยืดเป็น 9 เมตรให้ก้อนอ่านออกว่าเป็นก้อน สัดส่วนสูงต่อกว้างราว 1:2 */
              area:u[6], name:u[7], mono:u[8], cat:u[9], desc:u[10], picks:u[11]||[],
              lvl:f.lvl, pop:0, h: 9 + ((parseInt(u[0],10)*37) % 9) * 0.34};
    sh.corners = cornersOf(sh);
    /* กันชนรอบร้าน กว้างกว่าครึ่งช่องตาราง
       ทำให้จุดกลางช่องที่เดินได้ห่างจากตัวร้านเสมอ
       เส้นที่ลากจากช่องหนึ่งไปอีกช่องจึงเฉี่ยวมุมร้านไม่ได้ */
    sh.pad = cornersOf({cx:sh.cx, cz:sh.cz, w:sh.w+0.5, d:sh.d+0.5, rot:sh.rot});
    return sh;
  });
  shrinkOverlaps(f.shops);

  /* พื้นชั้น = เปลือกนูนของแนวร้าน ขยายออกไปอีก PAD เมตร */
  var pts = [];
  f.shops.forEach(function(s2){ s2.corners.forEach(function(p){ pts.push(p); }); });
  f.plate = expand(hull(pts), PAD);

  buildWalk(f);
  coreOf(f);
  f.shops.forEach(function(s2){ s2.door=null; });
  f.you = snapWalk(f, f.M(f.you[0], f.you[1]));
  f.conn = snapWalk(f, f.M(f.conn[0], f.conn[1]));
  /* ทำแผนที่ว่าช่องไหนเดินมาจากจุดอ้างอิงได้บ้าง แล้วให้ประตูเลือกจากช่องเหล่านั้นเท่านั้น */
  var st = nearestWalkCell(f, f.you);
  f.reachOK = st ? flood(f, idx(f,st.i,st.j)).seen : null;
  f.shops.forEach(function(s2){ s2.door = doorOf(f, s2); });
}

/* ใจกลางชั้น = จุดกึ่งกลางของแนวร้านทั้งหมด
   ใช้ตัดสินว่าด้านไหนของร้านคือหน้าร้าน ด้านไหนคือหลังร้าน */
function coreOf(f){
  var sx=0, sz=0;
  f.shops.forEach(function(s){ sx+=s.cx; sz+=s.cz; });
  f.core={x:sx/f.shops.length, z:sz/f.shops.length};
}
function cornersOf(s){
  var c = Math.cos(s.rot), n = Math.sin(s.rot), hw = s.w/2, hd = s.d/2;
  return [
    {x:s.cx - c*hw + n*hd, z:s.cz - n*hw - c*hd},
    {x:s.cx + c*hw + n*hd, z:s.cz + n*hw - c*hd},
    {x:s.cx + c*hw - n*hd, z:s.cz + n*hw + c*hd},
    {x:s.cx - c*hw - n*hd, z:s.cz - n*hw + c*hd}
  ];
}
function axesOf(c){
  var r=[];
  for(var i=0;i<4;i++){
    var a=c[i], b=c[(i+1)%4], ax=-(b.z-a.z), az=b.x-a.x, l=Math.hypot(ax,az)||1;
    r.push({x:ax/l, z:az/l});
  }
  return r;
}
function boxHit(A,B){
  var ax = axesOf(A).concat(axesOf(B));
  for(var i=0;i<ax.length;i++){
    var a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;
    for(var k=0;k<4;k++){
      var va=A[k].x*ax[i].x+A[k].z*ax[i].z; if(va<a0)a0=va; if(va>a1)a1=va;
      var vb=B[k].x*ax[i].x+B[k].z*ax[i].z; if(vb<b0)b0=vb; if(vb>b1)b1=vb;
    }
    if(a1 < b0 + 0.06 || b1 < a0 + 0.06) return false;
  }
  return true;
}
/* ผังลอกจากภาพ ยังไงก็มีกล่องเบียดกันบ้าง ตรงไหนเบียดหดลงจนพ้น */
function shrinkOverlaps(list){
  for(var pass=0; pass<50; pass++){
    var hit=false;
    for(var i=0;i<list.length;i++) for(var j=i+1;j<list.length;j++){
      if(!boxHit(list[i].corners, list[j].corners)) continue;
      hit=true;
      [list[i],list[j]].forEach(function(s){ s.w*=0.985; s.d*=0.985; s.corners=cornersOf(s); });
    }
    if(!hit) return;
  }
}
function hull(pts){
  var p = pts.slice().sort(function(a,b){ return a.x-b.x || a.z-b.z; });
  function cross(o,a,b){ return (a.x-o.x)*(b.z-o.z) - (a.z-o.z)*(b.x-o.x); }
  var lo=[], hi=[], i;
  for(i=0;i<p.length;i++){ while(lo.length>=2 && cross(lo[lo.length-2],lo[lo.length-1],p[i])<=0) lo.pop(); lo.push(p[i]); }
  for(i=p.length-1;i>=0;i--){ while(hi.length>=2 && cross(hi[hi.length-2],hi[hi.length-1],p[i])<=0) hi.pop(); hi.push(p[i]); }
  lo.pop(); hi.pop();
  return lo.concat(hi);
}
function expand(poly, d){
  var cx=0, cz=0;
  poly.forEach(function(p){ cx+=p.x; cz+=p.z; });
  cx/=poly.length; cz/=poly.length;
  return poly.map(function(p){
    var vx=p.x-cx, vz=p.z-cz, l=Math.hypot(vx,vz)||1;
    return {x:p.x+vx/l*d, z:p.z+vz/l*d};
  });
}
function inPoly(poly,x,z){
  var c=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    if(((poly[i].z>z)!==(poly[j].z>z)) &&
       (x < (poly[j].x-poly[i].x)*(z-poly[i].z)/(poly[j].z-poly[i].z)+poly[i].x)) c=!c;
  }
  return c;
}
function inBox(c,x,z){
  for(var i=0;i<4;i++){
    var a=c[i], b=c[(i+1)%4];
    if((b.x-a.x)*(z-a.z) - (b.z-a.z)*(x-a.x) < 0) return false;
  }
  return true;
}

/* ==================================================================
   3. ตารางพื้นที่เดินได้
      เดินได้ = อยู่ในพื้นชั้น + ไม่อยู่ในร้าน + อยู่ใกล้แนวร้านพอสมควร
      เงื่อนไขข้อสุดท้ายทำให้เส้นทางเกาะไปตามหน้าร้านเหมือนคนเดินจริง
      และตัดกลางโถงเปิดที่ไม่มีพื้นออกไปเองโดยไม่ต้องวาดช่องเปิดทีละชั้น
   ================================================================== */
function buildWalk(f){
  var xs = f.plate.map(function(p){return p.x;}), zs = f.plate.map(function(p){return p.z;});
  f.x0 = Math.min.apply(null,xs); f.z0 = Math.min.apply(null,zs);
  f.nx = Math.ceil((Math.max.apply(null,xs)-f.x0)/CELL)+1;
  f.nz = Math.ceil((Math.max.apply(null,zs)-f.z0)/CELL)+1;

  var inside = new Uint8Array(f.nx*f.nz);
  var near   = new Float32Array(f.nx*f.nz);
  var i,j,k;
  for(j=0;j<f.nz;j++) for(i=0;i<f.nx;i++){
    var x=f.x0+i*CELL, z=f.z0+j*CELL, id=j*f.nx+i;
    if(!inPoly(f.plate,x,z)) continue;
    var blocked=false, best=1e9;
    for(k=0;k<f.shops.length;k++){
      var s=f.shops[k];
      if(inBox(s.pad,x,z)){ blocked=true; break; }
      var dd=Math.hypot(s.cx-x, s.cz-z) - Math.max(s.w,s.d)/2;
      if(dd<best) best=dd;
    }
    if(blocked) continue;
    inside[id]=1; near[id]=best;
  }
  /* เดินได้คือ อยู่ในพื้นชั้น และไม่ทับร้าน เท่านั้น
     เคยลองตัดช่องที่อยู่ไกลหน้าร้านออกเพื่อให้เส้นทางเกาะทางเดิน
     แต่ตัดแล้วบล็อกริมโถงหลุดออกจากกัน บางร้านเดินไปไม่ถึงเลย
     เลยเปลี่ยนไปคุมด้วยค่าผ่านทางแทน ช่องที่อยู่กลางที่โล่งคิดแพงขึ้น
     เส้นทางจึงเลาะไปตามหน้าร้านเอง โดยไม่มีร้านไหนหลุดจากระบบ */
  f.walk = new Uint8Array(f.nx*f.nz);
  f.near = near;
  for(k=0;k<inside.length;k++) if(inside[k]) f.walk[k]=1;
  mainComponent(f);
  clearance(f);
}
/* ซอกเล็กๆ ที่ถูกร้านล้อมจนขาดจากทางเดินหลัก ต้องตัดทิ้ง
   ไม่งั้นประตูร้านจะไปตกอยู่ในซอก แล้วหาเส้นทางไม่เจอ */
function mainComponent(f){
  var N=f.nx*f.nz, seen=new Uint8Array(N), best=null;
  for(var s=0;s<N;s++){
    if(!f.walk[s]||seen[s]) continue;
    var q=[s], cells=[]; seen[s]=1;
    while(q.length){
      var id=q.pop(), i=id%f.nx, j=(id-i)/f.nx; cells.push(id);
      for(var dj=-1;dj<=1;dj++) for(var di=-1;di<=1;di++){
        if(!di&&!dj) continue;
        var a=i+di, b=j+dj;
        if(a<0||b<0||a>=f.nx||b>=f.nz) continue;
        var t=idx(f,a,b);
        if(seen[t]||!f.walk[t]) continue;
        if(di && dj && (!f.walk[idx(f,a,j)] || !f.walk[idx(f,i,b)])) continue;
        seen[t]=1; q.push(t);
      }
    }
    if(!best || cells.length>best.length) best=cells;
  }
  var keep=new Uint8Array(N);
  if(best) best.forEach(function(id){ keep[id]=1; });
  f.walk=keep;
}
function idx(f,i,j){ return j*f.nx+i; }
function cellOf(f,p){
  return {i:Math.round((p.x-f.x0)/CELL), j:Math.round((p.z-f.z0)/CELL)};
}
function flood(f, start){
  var seen = new Uint8Array(f.nx*f.nz), q=[start], n=0;
  seen[start]=1;
  while(q.length){
    var id=q.pop(), i=id%f.nx, j=(id-i)/f.nx; n++;
    for(var dj=-1;dj<=1;dj++) for(var di=-1;di<=1;di++){
      if(!di && !dj) continue;
      var a=i+di, b=j+dj;
      if(a<0||b<0||a>=f.nx||b>=f.nz) continue;
      var t=idx(f,a,b);
      if(seen[t]||!f.walk[t]) continue;
      /* ห้ามตัดมุมทแยงทะลุร้าน ต้องใช้กติกาเดียวกับ A*
         ไม่งั้นจะนับว่าช่องนั้นเดินถึงได้ทั้งที่ A* ไปไม่ได้จริง */
      if(di && dj && (!f.walk[idx(f,a,j)] || !f.walk[idx(f,i,b)])) continue;
      seen[t]=1; q.push(t);
    }
  }
  return {seen:seen, n:n};
}
function nearestWalkCell(f, p){
  var c = cellOf(f,p);
  for(var r=0;r<50;r++){
    for(var dj=-r;dj<=r;dj++) for(var di=-r;di<=r;di++){
      if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue;
      var a=c.i+di, b=c.j+dj;
      if(a<0||b<0||a>=f.nx||b>=f.nz) continue;
      if(f.walk[idx(f,a,b)]) return {i:a,j:b};
    }
  }
  return null;
}
function allReachable(f){
  var st = nearestWalkCell(f, {x:f.you[0]!==undefined?0:0, z:0});
  /* ใช้จุดใดจุดหนึ่งที่เดินได้เป็นตัวตั้ง แล้วดูว่าครอบคลุมทุกร้านไหม */
  var first=-1;
  for(var k=0;k<f.walk.length;k++) if(f.walk[k]){ first=k; break; }
  if(first<0) return false;
  var fl = flood(f, first);
  for(var s=0;s<f.shops.length;s++){
    var c = nearestWalkCell(f, {x:f.shops[s].cx, z:f.shops[s].cz});
    if(!c || !fl.seen[idx(f,c.i,c.j)]) return false;
  }
  return true;
}
/* ระยะห่างจากสิ่งกีดขวาง ใช้ถ่วงให้เส้นทางเดินกลางทางเดิน ไม่เฉียดหน้าร้าน */
function clearance(f){
  var D = new Float32Array(f.nx*f.nz).fill(1e9), q=[], i,j;
  for(j=0;j<f.nz;j++) for(i=0;i<f.nx;i++){
    var id=idx(f,i,j);
    if(f.walk[id]) continue;
    D[id]=0; q.push(id);
  }
  var h=0;
  while(h<q.length){
    var id=q[h++], i2=id%f.nx, j2=(id-i2)/f.nx;
    for(var dj=-1;dj<=1;dj++) for(var di=-1;di<=1;di++){
      if(!di && !dj) continue;
      var a=i2+di, b=j2+dj;
      if(a<0||b<0||a>=f.nx||b>=f.nz) continue;
      var t=idx(f,a,b), nd=D[id]+((di&&dj)?1.414:1);
      if(nd<D[t]){ D[t]=nd; q.push(t); }
    }
  }
  f.clear=D;
}
function snapWalk(f,p){
  var c = nearestWalkCell(f,p);
  if(!c) return p;
  /* ขยับไปหาช่องที่โล่งที่สุดในละแวก จะได้ไม่ยืนติดผนังร้าน */
  var best=c, bv=f.clear[idx(f,c.i,c.j)];
  for(var dj=-3;dj<=3;dj++) for(var di=-3;di<=3;di++){
    var a=c.i+di, b=c.j+dj;
    if(a<0||b<0||a>=f.nx||b>=f.nz) continue;
    var t=idx(f,a,b);
    if(f.walk[t] && f.clear[t]>bv){ bv=f.clear[t]; best={i:a,j:b}; }
  }
  return {x:f.x0+best.i*CELL, z:f.z0+best.j*CELL};
}
/* ประตูร้าน — ต้องอยู่ด้านที่เป็นทางเดินจริง ไม่ใช่ด้านหลังตึก
   เคยตัดสินจากทิศไปยังจุดกึ่งกลางของชั้น ซึ่งผิดกับร้านที่อยู่คนละฝั่งของจุดนั้น
   45 จาก 153 ร้านได้ประตูผิดด้าน แล้วเส้นทางก็วิ่งอ้อมไปหลังร้านตาม

   วิธีใหม่ วัดความโล่งของทั้งสี่ด้านเอง ด้านไหนมีทางเดินกว้างที่สุดคือหน้าร้าน
   วัดจากค่าความห่างจากสิ่งกีดขวางของช่องที่อยู่ถัดออกไปจากผนังด้านนั้น
   เป็นการถามตัวผังตรงๆ ว่าด้านไหนคนเดินได้ ไม่ต้องเดาจากรูปทรงรวม */
function doorOf(f,s){
  var best=null, i;
  for(i=0;i<4;i++){
    var a=s.corners[i], b=s.corners[(i+1)%4];
    var nx=(b.z-a.z), nz=-(b.x-a.x), nl=Math.hypot(nx,nz)||1; nx/=nl; nz/=nl;
    var mx=(a.x+b.x)/2, mz=(a.z+b.z)/2;
    var sum=0, cnt=0, first=null;
    for(var d=1.4; d<=10; d+=1.1){
      var x=mx+nx*d, z=mz+nz*d;
      var ci=Math.round((x-f.x0)/CELL), cj=Math.round((z-f.z0)/CELL);
      if(ci<0||cj<0||ci>=f.nx||cj>=f.nz) continue;
      var t=idx(f,ci,cj);
      var okCell = f.walk[t] && (!f.reachOK || f.reachOK[t]);
      sum += okCell ? f.clear[t] : 0;
      cnt++;
      if(okCell && !first && f.clear[t]>=1.05) first={x:x, z:z, i:ci, j:cj};
    }
    if(!cnt || !first) continue;
    var open=sum/cnt;
    if(!best || open>best.open) best={open:open, p:first};
  }
  if(best) return best.p;

  /* ไม่มีด้านไหนเจอทางเดินภายใน 10 เมตรเลย
     เกิดกับร้านที่ถูกร้านข้างเคียงล้อมสนิท ซึ่งเป็นผลจากผังที่ประมาณมา ไม่ใช่ของจริง
     กรณีนี้ยิงรังสีออกไปไกลขึ้นทีละด้าน แล้วเลือกด้านที่เจอทางเดินก่อน
     สำคัญที่ต้องยังเลือกเป็นราย "ด้าน" อยู่ ไม่ใช่คว้าช่องที่ใกล้ที่สุดรอบตัว
     เพราะช่องที่ใกล้ที่สุดมักอยู่ข้างหลัง แล้วเส้นทางจะวิ่งอ้อมไปหลังร้าน */
  var far=null;
  for(i=0;i<4;i++){
    var a2=s.corners[i], b2=s.corners[(i+1)%4];
    var mx2=(a2.x+b2.x)/2, mz2=(a2.z+b2.z)/2;
    var nx2=(b2.z-a2.z), nz2=-(b2.x-a2.x), nl2=Math.hypot(nx2,nz2)||1; nx2/=nl2; nz2/=nl2;
    for(var d2=1.4; d2<=30; d2+=0.8){
      var x2=mx2+nx2*d2, z2=mz2+nz2*d2;
      var ci2=Math.round((x2-f.x0)/CELL), cj2=Math.round((z2-f.z0)/CELL);
      if(ci2<0||cj2<0||ci2>=f.nx||cj2>=f.nz) break;
      var t2=idx(f,ci2,cj2);
      if(f.walk[t2] && (!f.reachOK || f.reachOK[t2]) && f.clear[t2]>=1.05){
        if(!far || d2<far.d) far={d:d2, p:{x:x2, z:z2, i:ci2, j:cj2}};
        break;
      }
    }
  }
  if(far) return far.p;
  return {x:s.cx, z:s.cz, i:cellOf(f,{x:s.cx,z:s.cz}).i, j:cellOf(f,{x:s.cx,z:s.cz}).j};
}

/* ==================================================================
   4. หาเส้นทาง A* บนตารางเดินได้ แล้วรีดให้ตรง
      เดินทะลุร้านไม่ได้เด็ดขาด เพราะช่องที่เป็นร้านไม่อยู่ในตารางตั้งแต่แรก
   ================================================================== */
function astar(f, a, b){
  var N=f.nx*f.nz, g=new Float32Array(N).fill(Infinity), prev=new Int32Array(N).fill(-1);
  var open=[], sid=idx(f,a.i,a.j), gid=idx(f,b.i,b.j);
  if(!f.walk[sid] || !f.walk[gid]) return null;
  function hcost(i,j){ var dx=Math.abs(i-b.i), dz=Math.abs(j-b.j);
    return (Math.max(dx,dz)+0.414*Math.min(dx,dz))*CELL; }
  g[sid]=0; open.push({id:sid,f:hcost(a.i,a.j)});
  var closed=new Uint8Array(N);
  while(open.length){
    var bi=0;
    for(var k=1;k<open.length;k++) if(open[k].f<open[bi].f) bi=k;
    var cur=open.splice(bi,1)[0];
    if(cur.id===gid) break;
    if(closed[cur.id]) continue;
    closed[cur.id]=1;
    var i=cur.id%f.nx, j=(cur.id-i)/f.nx;
    for(var dj=-1;dj<=1;dj++) for(var di=-1;di<=1;di++){
      if(!di && !dj) continue;
      var x=i+di, z=j+dj;
      if(x<0||z<0||x>=f.nx||z>=f.nz) continue;
      var t=idx(f,x,z);
      if(!f.walk[t]||closed[t]) continue;
      if(di&&dj && (!f.walk[idx(f,x,j)] || !f.walk[idx(f,i,z)])) continue;  /* ห้ามตัดมุมทะลุร้าน */
      /* ถ่วงเฉพาะตอนชิดร้านเกินไป เส้นทางจะเดินกลางทางเดินโดยไม่เบียดหน้าร้าน
         เคยถ่วงเพิ่มตอนอยู่ห่างหน้าร้านด้วย หวังให้เลาะไปตามแนวร้าน
         แต่กลายเป็นดันให้เดินอ้อมไปหลังตึก จึงตัดทิ้ง เหลือแค่หาทางที่สั้นที่สุด */
      var pen = 1 + Math.max(0, 2.4 - f.clear[t]) * 0.5;
      var ng = g[cur.id] + ((di&&dj)?1.414:1)*CELL*pen;
      if(ng < g[t]){ g[t]=ng; prev[t]=cur.id; open.push({id:t, f:ng+hcost(x,z)}); }
    }
  }
  if(g[gid]===Infinity) return null;
  var path=[], id=gid;
  while(id>=0){ var i2=id%f.nx; path.unshift({x:f.x0+i2*CELL, z:f.z0+((id-i2)/f.nx)*CELL}); id=prev[id]; }
  return smooth(f, path);
}
/* ตารางหยาบ 1.2 เมตร เส้นตรงลอดซอกร้านได้ถ้าเช็คแต่ตาราง
   จึงต้องเช็คกับกล่องร้านจริงด้วย ถี่กว่าขนาดช่องหลายเท่า */
function lineClear(f,a,b){
  var d=Math.hypot(b.x-a.x, b.z-a.z), n=Math.max(2, Math.ceil(d/0.35));
  for(var k=0;k<=n;k++){
    var x=a.x+(b.x-a.x)*k/n, z=a.z+(b.z-a.z)*k/n;
    var i=Math.round((x-f.x0)/CELL), j=Math.round((z-f.z0)/CELL);
    if(i<0||j<0||i>=f.nx||j>=f.nz||!f.walk[idx(f,i,j)]) return false;
    for(var s=0;s<f.shops.length;s++) if(inBox(f.shops[s].corners, x, z)) return false;
  }
  return true;
}
function smooth(f, p){
  var out=[p[0]], i=0;
  while(i < p.length-1){
    var j=p.length-1;
    while(j > i+1 && !lineClear(f, p[i], p[j])) j--;
    out.push(p[j]); i=j;
  }
  return out;
}
function pathLen(p){
  var L=0;
  for(var i=0;i<p.length-1;i++) L+=Math.hypot(p[i+1].x-p[i].x, p[i+1].z-p[i].z);
  return L;
}


/* ==================================================================
   4b. วางแผนเส้นทางจากจุดใดก็ได้ ไปร้านใดก็ได้ ข้ามชั้นได้
       เดิมเดินได้จากตู้ไปร้านอย่างเดียว ตอนนี้ร้านไหนก็เป็นต้นทางได้
       153 ร้านจับคู่กันได้ 23,256 คู่ คำนวณล่วงหน้าทั้งหมดใช้เวลาราวแปดนาที
       จึงคำนวณตอนกดเลือกเท่านั้น วัดแล้วเส้นละราว 20 มิลลิวินาที คนไม่รู้สึก
   ================================================================== */
var WALK_MS = 1.2;                 /* คนเดินในห้างราว 1.2 เมตรต่อวินาที */

function floorOf(lvl){
  for(var i=0;i<FLOORS.length;i++) if(FLOORS[i].lvl===lvl) return FLOORS[i];
  return null;
}
function anchorPoint(o){
  /* o = null แปลว่าจุดที่ตู้ตั้งอยู่ */
  if(!o) return {lvl:KIOSK_LVL, p:floorOf(KIOSK_LVL).you, label:"จุดที่คุณยืน", shop:null};
  return {lvl:o.lvl, p:o.door, label:o.name, shop:o};
}
function legOn(f, a, b){
  var ca=nearestWalkCell(f,a), cb=(b.i!==undefined)?{i:b.i,j:b.j}:nearestWalkCell(f,b);
  if(!ca||!cb) return null;
  var r=astar(f, ca, cb);
  if(!r||!r.length) return null;
  r[0]={x:a.x, z:a.z};
  r[r.length-1]={x:b.x, z:b.z};
  return r;
}
function buildPlan(originShop, destShop){
  var A=anchorPoint(originShop), B={lvl:destShop.lvl, p:destShop.door, label:destShop.name, shop:destShop};
  var plan={from:A, to:B, legs:[], totalM:0};
  if(A.lvl===B.lvl){
    var f=floorOf(A.lvl), r=legOn(f, A.p, B.p);
    if(!r) return null;
    plan.legs.push({lvl:A.lvl, path:r});
  } else {
    var f1=floorOf(A.lvl), f2=floorOf(B.lvl);
    var r1=legOn(f1, A.p, f1.conn), r2=legOn(f2, f2.conn, B.p);
    if(!r1||!r2) return null;
    plan.legs.push({lvl:A.lvl, path:r1});
    plan.up={from:A.lvl, to:B.lvl};
    plan.legs.push({lvl:B.lvl, path:r2});
  }
  plan.legs.forEach(function(l){ l.m=pathLen(l.path); plan.totalM+=l.m; });
  plan.mins=Math.max(1, Math.round(plan.totalM/WALK_MS/60));
  plan.steps=stepsOf(plan);
  return plan;
}

/* แปลงเส้นทางเป็นขั้นตอน ตัดที่จุดหักเลี้ยว
   ช่วงสั้นกว่า 5 เมตรยุบรวมกับช่วงถัดไป ไม่งั้นจะได้ขั้นตอนจุกจิกที่ไม่มีใครอ่าน */
function stepsOf(plan){
  var steps=[], MERGE=8, TURN=0.42;
  plan.legs.forEach(function(leg, li){
    var p=leg.path, segs=[];
    for(var i=0;i<p.length-1;i++){
      var d=Math.hypot(p[i+1].x-p[i].x, p[i+1].z-p[i].z);
      var join=false;
      if(segs.length){
        var last=segs[segs.length-1];
        var hx=last.b.x-last.a.x, hz=last.b.z-last.a.z;
        var nx=p[i+1].x-p[i].x, nz=p[i+1].z-p[i].z;
        var hl=Math.hypot(hx,hz)||1, nl=Math.hypot(nx,nz)||1;
        var dot=(hx/hl)*(nx/nl)+(hz/hl)*(nz/nl);
        var ang=Math.acos(Math.max(-1,Math.min(1,dot)));
        /* รวมกับช่วงก่อนหน้าเมื่อ ช่วงสั้นมาก หรือ ทิศแทบไม่เปลี่ยน
           ข้อสองสำคัญ ไม่งั้นจะได้ขั้นตอน "เดินตรงต่อไป" ติดกันหลายขั้น
           ซึ่งอ่านแล้วงงว่าทำไมต้องแยกขั้น ทั้งที่เดินเส้นเดียวกัน */
        join = (d<MERGE) || (ang<TURN);
      }
      if(join){ segs[segs.length-1].b=p[i+1]; }
      else segs.push({a:p[i], b:p[i+1]});
    }
    if(!segs.length) segs=[{a:p[0], b:p[p.length-1]}];
    segs.forEach(function(sg, si){
      var d=Math.hypot(sg.b.x-sg.a.x, sg.b.z-sg.a.z);
      var turn=null;
      if(si>0){
        var pv=segs[si-1];
        var hx=pv.b.x-pv.a.x, hz=pv.b.z-pv.a.z;
        var nx=sg.b.x-sg.a.x, nz=sg.b.z-sg.a.z;
        var hl=Math.hypot(hx,hz)||1, nl=Math.hypot(nx,nz)||1;
        var cross=(hx/hl)*(nz/nl)-(hz/hl)*(nx/nl);
        var dot=(hx/hl)*(nx/nl)+(hz/hl)*(nz/nl);
        var ang=Math.acos(Math.max(-1,Math.min(1,dot)));
        if(ang>TURN) turn={side: cross>0 ? "ขวา" : "ซ้าย", sharp: ang>1.0};
      }
      steps.push({kind:"walk", lvl:leg.lvl, a:sg.a, b:sg.b, m:d, turn:turn,
                  first:(li===0 && si===0), lastLeg:(li===plan.legs.length-1),
                  lastSeg:(si===segs.length-1)});
    });
    if(plan.up && li===0) steps.push({kind:"lift", lvl:leg.lvl, up:plan.up, a:p[p.length-1], b:p[p.length-1]});
  });
  /* เขียนข้อความของแต่ละขั้น */
  steps.forEach(function(st, i){
    if(st.kind==="lift"){
      var d=st.up.to>st.up.from;
      st.text='<span class="esc">'+(d?"▲":"▼")+' ชั้น '+st.up.from+' → ชั้น '+st.up.to+'</span> '
             +(d?"ขึ้น":"ลง")+'<b>บันไดเลื่อน</b>ไปยังชั้น '+st.up.to;
      st.sub="ผ่าน "+Math.abs(st.up.to-st.up.from)+" ชั้น";
      return;
    }
    var m=Math.round(st.m);
    if(st.first) st.text="ออกจาก<b>"+plan.from.label+"</b> เดินตรงไปราว "+m+" เมตร";
    else if(st.turn) st.text="เลี้ยว"+(st.turn.sharp?"":"เฉียง")+"<b>"+st.turn.side+"</b> แล้วเดินต่อราว "+m+" เมตร";
    else st.text="เดินตรงต่อไปราว "+m+" เมตร";
    if(st.lastLeg && st.lastSeg) st.text += " จะเจอ<b>"+plan.to.label+"</b>";
    st.sub="ชั้น "+st.lvl+" · "+floorOf(st.lvl).zone;
  });
  return steps;
}

/* ==================================================================
   5. เรนเดอเรอร์ 3 มิติ เขียนเองบน canvas 2 มิติ
      ไม่ใช้ WebGL เพราะมินิพีซีในตู้ห้างมักไม่มีการ์ดจอ
   ================================================================== */
var cv=$("view"), ctx=cv.getContext("2d"), W=0, H=0;
var cur=null, cam=null, HOME=null, FOV=0.8;
var KIOSK_LVL = 1;                 /* ชั้นที่ตู้ตัวนี้ตั้งอยู่จริง */
function atKiosk(){ return cur.lvl === KIOSK_LVL; }
/* จุดอ้างอิงของแต่ละชั้น ชั้นที่ตู้ตั้งอยู่คือตัวตู้ ชั้นอื่นคือหัวบันไดเลื่อนที่เดินขึ้นมาถึง */
function anchor(f){ return f.lvl === KIOSK_LVL ? f.you : f.conn; }
var eye={x:0,y:0,z:0}, bx={}, by={}, bz={}, focal=1;
var ZMIN=42, ZMAX=300;

function framing(f){
  var xs=f.plate.map(function(p){return p.x;}), zs=f.plate.map(function(p){return p.z;});
  var cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
  var cz=(Math.min.apply(null,zs)+Math.max.apply(null,zs))/2;
  var span=Math.max(Math.max.apply(null,xs)-Math.min.apply(null,xs),
                    Math.max.apply(null,zs)-Math.min.apply(null,zs));
  /* หลักป้ายบอกทาง จุดที่คุณอยู่ต้องอยู่ล่างจอเสมอ
     คำนวณมุมกล้องจากตำแหน่งตู้ ย้ายตู้ไปไหนกติกาก็ยังอยู่ */
  var a=anchor(f);
  var g={tx:cx, tz:cz, yaw:Math.atan2(a.x-cx, a.z-cz), pitch:0.60, dist:Math.max(ZMIN, span*0.6)};
  return autoFit(f, g);
}
/* ถอยกล้องจนผังทั้งชั้นอยู่ในเฟรมพอดี ทำงานได้ทุกอัตราส่วนจอ
   ไม่ต้องมานั่งจูนระยะกล้องทีละชั้น */
function autoFit(f, g){
  if(!W || !H) return g;
  var save=cam; cam=g;
  for(var k=0;k<60;k++){
    updateCam();
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9, ok=true;
    for(var i=0;i<f.plate.length;i++){
      var q=P(f.plate[i].x, 0, f.plate[i].z);
      if(!q){ ok=false; break; }
      if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y;
    }
    if(ok && x0>W*0.015 && x1<W*0.985 && y0>H*0.02 && y1<H*0.97) break;
    g.dist=Math.min(ZMAX, g.dist*1.035);
    if(g.dist>=ZMAX) break;
  }
  /* เลื่อนเป้ากล้องตามแนวพื้น ให้จุดอ้างอิงตกที่ราว 62% จากบนของกรอบแผนผัง
     นี่คือกติกาป้ายบอกทาง จุดที่คุณยืนต้องอยู่ล่างจอ ใกล้ระดับสายตาคน
     จัดตามจุดอ้างอิง ไม่ใช่ตามกึ่งกลางผัง เพราะกติกาอยู่ที่จุดอ้างอิง */
  var ux=-Math.sin(g.yaw), uz=-Math.cos(g.yaw);   /* ทิศบนพื้นที่ฉายขึ้นบนจอ */
  var A=anchor(f);
  for(var n=0;n<9;n++){
    updateCam();
    var ap=P(A.x,0,A.z); if(!ap) break;
    var dy=(H*0.62)-ap.y;
    if(Math.abs(dy)<5) break;
    var step=dy*g.dist/focal/Math.max(0.35,Math.sin(g.pitch));
    g.tx+=ux*step; g.tz+=uz*step;
    /* เลื่อนแล้วต้องไม่ทำให้ผังล้นเฟรม ถ้าล้นก็ถอยกล้องเพิ่ม */
    updateCam();
    var y0b=1e9,y1b=-1e9,x0b=1e9,x1b=-1e9,okb=true;
    for(var m2=0;m2<f.plate.length;m2++){
      var r2=P(f.plate[m2].x,0,f.plate[m2].z);
      if(!r2){ okb=false; break; }
      if(r2.y<y0b)y0b=r2.y; if(r2.y>y1b)y1b=r2.y;
      if(r2.x<x0b)x0b=r2.x; if(r2.x>x1b)x1b=r2.x;
    }
    if(!okb || y0b<H*0.015 || y1b>H*0.985 || x0b<W*0.012 || x1b>W*0.988){
      g.dist=Math.min(ZMAX, g.dist*1.06);
    }
  }
  /* รอบสุดท้าย ถอยกล้องอย่างเดียวจนไม่ล้นเฟรม ไม่ขยับเป้าแล้ว
     จุดอ้างอิงจะขยับเข้ากลางนิดหน่อย แต่ยังอยู่ครึ่งล่างตามกติกา */
  for(var z=0; z<50; z++){
    updateCam();
    var q0=1e9,q1=-1e9,w0=1e9,w1=-1e9,fine=true;
    for(var m3=0;m3<f.plate.length;m3++){
      var r3=P(f.plate[m3].x,0,f.plate[m3].z);
      if(!r3){ fine=false; break; }
      if(r3.y<q0)q0=r3.y; if(r3.y>q1)q1=r3.y;
      if(r3.x<w0)w0=r3.x; if(r3.x>w1)w1=r3.x;
    }
    if(fine && q0>H*0.015 && q1<H*0.975 && w0>W*0.012 && w1<W*0.988) break;
    if(g.dist>=ZMAX) break;
    g.dist=Math.min(ZMAX, g.dist*1.03);
  }
  cam=save;
  return g;
}
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1, 2), r=cv.getBoundingClientRect();
  W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", function(){
  resize();
  if(cur){ HOME=framing(cur); if(!selected) cam=snapFrom(HOME); }
});

function updateCam(){
  var cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  eye.x=cam.tx+cam.dist*cp*Math.sin(cam.yaw);
  eye.y=cam.dist*sp;
  eye.z=cam.tz+cam.dist*cp*Math.cos(cam.yaw);
  var fx=cam.tx-eye.x, fy=-eye.y, fz=cam.tz-eye.z, fl=Math.hypot(fx,fy,fz);
  bz.x=fx/fl; bz.y=fy/fl; bz.z=fz/fl;
  bx.x=-bz.z; bx.y=0; bx.z=bz.x;    /* = cross(forward, worldUp) — อย่าสลับเครื่องหมาย ภาพจะกลับหัว */
  var rl=Math.hypot(bx.x,bx.z)||1; bx.x/=rl; bx.z/=rl;
  by.x=bx.y*bz.z-bx.z*bz.y; by.y=bx.z*bz.x-bx.x*bz.z; by.z=bx.x*bz.y-bx.y*bz.x;
  focal=(H/2)/Math.tan(FOV/2);
}
function P(x,y,z){
  var dx=x-eye.x, dy=y-eye.y, dz=z-eye.z;
  var cz=dx*bz.x+dy*bz.y+dz*bz.z;
  if(cz<0.5) return null;
  return {x:W/2+focal*(dx*bx.x+dy*bx.y+dz*bx.z)/cz,
          y:H/2-focal*(dx*by.x+dy*by.y+dz*by.z)/cz, z:cz};
}
function poly(pts, fill, stroke, lw){
  for(var i=0;i<pts.length;i++) if(!pts[i]) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(var j=1;j<pts.length;j++) ctx.lineTo(pts[j].x,pts[j].y);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
function shade(hex, k){
  var n=parseInt(hex.slice(1),16);
  return "rgb("+Math.round((n>>16&255)*k)+","+Math.round((n>>8&255)*k)+","+Math.round((n&255)*k)+")";
}

/* ==================================================================
   6. สถานะ
   ================================================================== */
var selected=null, cat="", query="", route=null, legNote="", walker=null;
var origin=null;        /* ต้นทาง null = จุดที่ตู้ตั้งอยู่ */
var pickingFrom=false;  /* กำลังให้ผู้ใช้เลือกร้านต้นทางอยู่หรือเปล่า */
var plan=null, stepAt=0;
var idleSpin=false, idleTimer=null, flying=null, t0=performance.now();

function visible(s){
  if(cat && s.cat!==cat) return false;
  if(query){
    var q=query.toLowerCase();
    var hay=(s.name+" "+s.desc+" "+s.no+" "+(CAT[s.cat]?CAT[s.cat].name:"")).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function matches(){
  var out=[];
  FLOORS.forEach(function(f){ f.shops.forEach(function(s){ if(visible(s)) out.push(s); }); });
  return out;
}

/* ==================================================================
   7. วาดภาพ
   ================================================================== */
function draw(){
  var t=(performance.now()-t0)/1000;
  if(idleSpin) cam.yaw+=0.0012;
  if(flying) stepFly();
  cur.shops.forEach(function(s){ s.pop += (((selected===s)?1:0) - s.pop)*0.16; });
  updateCam();
  ctx.clearRect(0,0,W,H);

  poly(cur.plate.map(function(p){ return P(p.x,0,p.z); }), "#DCD8C7", "rgba(35,35,31,.2)", 1.2);
  drawWalkSurface();
  if(route) drawRoute();

  var order=cur.shops.map(function(s){
    return {s:s, d:(s.cx-eye.x)*(s.cx-eye.x)+(s.cz-eye.z)*(s.cz-eye.z)};
  }).sort(function(a,b){ return b.d-a.d; });
  var labels=[];
  order.forEach(function(o){ drawShop(o.s, labels); });

  drawConnector(t);
  drawYou(t);
  if(walker) drawWalker();
  labels.sort(function(a,b){ return b.z-a.z; }).forEach(drawLabel);
}

/* พื้นทางเดินวาดจากตารางเดินได้จริง คนจะเห็นว่าเดินตรงไหนได้บ้าง */
function drawWalkSurface(){
  var f=cur, step=2;
  ctx.fillStyle="#E9E5D6";
  for(var j=0;j<f.nz-step;j+=step) for(var i=0;i<f.nx-step;i+=step){
    if(!f.walk[idx(f,i,j)]) continue;
    var x=f.x0+i*CELL, z=f.z0+j*CELL, e=CELL*step;
    var a=P(x,0.02,z), b=P(x+e,0.02,z), c=P(x+e,0.02,z+e), d=P(x,0.02,z+e);
    if(!a||!b||!c||!d) continue;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
  }
}

function drawShop(s, labels){
  var vis=visible(s), sel=(selected===s);
  var col=CAT[s.cat] ? CAT[s.cat].c : "#C7BFA8";
  var y=(vis? s.h : s.h*0.45) + s.pop*2.2;
  var c=s.corners;
  var top=[P(c[0].x,y,c[0].z),P(c[1].x,y,c[1].z),P(c[2].x,y,c[2].z),P(c[3].x,y,c[3].z)];
  var bot=[P(c[0].x,0,c[0].z),P(c[1].x,0,c[1].z),P(c[2].x,0,c[2].z),P(c[3].x,0,c[3].z)];
  ctx.globalAlpha = vis ? 1 : 0.24;
  for(var i=0;i<4;i++){
    var a=c[i], b=c[(i+1)%4];
    /* cornersOf เรียงมุมทวนเข็ม สูตร (-dz, dx) จึงได้นอร์มอลชี้เข้าในกล่อง
       ถ้าใช้ตรงๆ จะกลายเป็นวาดผนังด้านหลังแทนด้านหน้า ตึกจะโปร่งเหมือนเต๊นท์
       ต้องกลับเครื่องหมายเป็น (dz, -dx) ให้ชี้ออกนอกก่อน แล้วค่อยตัดด้านที่หันหลัง */
    var nx=(b.z-a.z), nz=-(b.x-a.x), nl=Math.hypot(nx,nz)||1; nx/=nl; nz/=nl;
    if(nx*(eye.x-s.cx)+nz*(eye.z-s.cz) <= 0) continue;
    /* ต่างแสงระหว่างด้านมากขึ้น ก้อนจะอ่านออกว่ามีปริมาตร ไม่ใช่แถบสีแบน */
    var lit=0.44+0.46*Math.abs(nx*0.78+nz*0.34);
    poly([bot[i],bot[(i+1)%4],top[(i+1)%4],top[i]],
         sel ? shade("#23231F",1+lit) : shade(col,lit),
         "rgba(35,35,31,.42)", 1);
  }
  poly(top, sel ? "#23231F" : shade(col,1.06), sel ? "#F7F4EA" : "rgba(35,35,31,.32)", sel?2:1);
  /* เงาทอดลงพื้น ช่วยให้ก้อนดูลอยขึ้นจากพื้นจริงๆ */
  if(vis){
    var sh=[];
    for(var q=0;q<4;q++) sh.push(P(c[q].x + s.h*0.34, 0.03, c[q].z + s.h*0.2));
    ctx.globalAlpha=0.12; poly(sh, "#23231F", null); ctx.globalAlpha=1;
  }
  if(vis && s.door){
    var d0=P(s.door.x,0,s.door.z), d1=P(s.door.x,2.4,s.door.z);
    if(d0&&d1){
      ctx.strokeStyle = sel ? "rgba(192,112,63,.95)" : "rgba(35,35,31,.26)";
      ctx.lineWidth = sel ? 2.4 : 1.1;
      ctx.beginPath(); ctx.moveTo(d0.x,d0.y); ctx.lineTo(d1.x,d1.y); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  if(sel){
    var lp=P(s.cx, y+5, s.cz);
    if(lp) labels.push({x:lp.x, y:lp.y, z:lp.z, name:s.name});
  }
}
function drawLabel(l){
  ctx.save();
  ctx.font="400 "+Math.max(11,Math.min(19,620/l.z))+"px Prompt, sans-serif";
  var w=ctx.measureText(l.name).width, padx=11, h=27;
  ctx.fillStyle="#23231F"; ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(l.x-w/2-padx, l.y-h, w+padx*2, h, 13);
  else ctx.rect(l.x-w/2-padx, l.y-h, w+padx*2, h);
  ctx.fill();
  ctx.fillStyle="#F7F4EA"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(l.name, l.x, l.y-h/2+1);
  ctx.strokeStyle="#23231F"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(l.x,l.y+9); ctx.stroke();
  ctx.restore();
}
function drawRoute(){
  ctx.save(); ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.strokeStyle="rgba(192,112,63,.22)"; ctx.lineWidth=10; strokeRoute();
  ctx.strokeStyle="#C0703F"; ctx.lineWidth=3.2; strokeRoute();
  ctx.restore();
}
function strokeRoute(){
  ctx.beginPath(); var on=false;
  route.forEach(function(p){
    var q=P(p.x,0.14,p.z); if(!q) return;
    if(on) ctx.lineTo(q.x,q.y); else { ctx.moveTo(q.x,q.y); on=true; }
  });
  ctx.stroke();
}
function drawYou(t){
  if(!atKiosk()) return;                 /* ชั้นอื่นไม่มีตู้ ไม่ต้องปักหมุดว่าคุณอยู่ตรงนี้ */
  var base=P(cur.you.x,0,cur.you.z), tip=P(cur.you.x,7,cur.you.z);
  if(!base||!tip) return;
  var pulse=1+Math.sin(t*1.7)*0.16;
  ctx.save();
  ctx.strokeStyle="rgba(192,112,63,.34)"; ctx.lineWidth=1.6;
  var r=Math.max(6,210/base.z)*pulse;
  ctx.beginPath(); ctx.ellipse(base.x,base.y,r,r*0.44,0,0,6.2832); ctx.stroke();
  ctx.strokeStyle="#C0703F"; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  ctx.fillStyle="#C0703F";
  ctx.beginPath(); ctx.arc(tip.x,tip.y,Math.max(4.4,108/tip.z),0,6.2832); ctx.fill();
  ctx.fillStyle="#EDE9DA";
  ctx.beginPath(); ctx.arc(tip.x,tip.y,Math.max(1.7,42/tip.z),0,6.2832); ctx.fill();
  ctx.restore();
}
/* บันไดเลื่อน จุดเชื่อมระหว่างชั้น */
function drawConnector(t){
  var p=cur.conn, b=P(p.x,0,p.z), a=P(p.x,3.4,p.z);
  if(!a||!b) return;
  var here=!atKiosk();
  ctx.save();
  if(here){
    var pulse=1+Math.sin(t*1.7)*0.16, rr=Math.max(6,190/b.z)*pulse;
    ctx.strokeStyle="rgba(192,112,63,.34)"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(b.x,b.y,rr,rr*0.44,0,0,6.2832); ctx.stroke();
  }
  ctx.strokeStyle=here?"#C0703F":"rgba(35,35,31,.4)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(a.x,a.y); ctx.stroke();
  var r=Math.max(3.4,86/a.z);
  ctx.fillStyle="#EDE9DA"; ctx.strokeStyle=here?"#C0703F":"#23231F"; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(a.x,a.y,r,0,6.2832); ctx.fill(); ctx.stroke();
  ctx.fillStyle=here?"#C0703F":"#23231F";
  ctx.beginPath();
  ctx.moveTo(a.x, a.y-r*0.52); ctx.lineTo(a.x+r*0.42, a.y+r*0.2); ctx.lineTo(a.x-r*0.42, a.y+r*0.2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawWalker(){
  var p=P(walker.p.x,1.1,walker.p.z); if(!p) return;
  ctx.save(); ctx.fillStyle="#23231F";
  ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(3,72/p.z),0,6.2832); ctx.fill(); ctx.restore();
}

/* ==================================================================
   8. กล้อง
   ================================================================== */
function flyTo(s){
  var yaw=Math.atan2(s.cx-HOME.tx, s.cz-HOME.tz), d=yaw-cam.yaw;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  flying={t:0, from:snapCam(), to:{tx:s.cx, tz:s.cz, yaw:cam.yaw+d, pitch:0.58, dist:Math.max(ZMIN,62)}};
}
function flyHome(){
  var d=HOME.yaw-cam.yaw;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  flying={t:0, from:snapCam(), to:{tx:HOME.tx, tz:HOME.tz, yaw:cam.yaw+d, pitch:HOME.pitch, dist:HOME.dist}};
}
function snapCam(){ return {tx:cam.tx, tz:cam.tz, yaw:cam.yaw, pitch:cam.pitch, dist:cam.dist}; }
function stepFly(){
  flying.t+=0.028;
  var k=flying.t>=1?1:1-Math.pow(1-flying.t,3), f=flying.from, g=flying.to;
  cam.tx=f.tx+(g.tx-f.tx)*k; cam.tz=f.tz+(g.tz-f.tz)*k;
  cam.yaw=f.yaw+(g.yaw-f.yaw)*k; cam.pitch=f.pitch+(g.pitch-f.pitch)*k;
  cam.dist=f.dist+(g.dist-f.dist)*k;
  if(flying.t>=1) flying=null;
}
function zoom(k){
  cam.dist=Math.max(ZMIN, Math.min(ZMAX, cam.dist*k));
  flying=null; kick();
}
function startWalker(){
  walker = (route && route.length>1) ? {i:0,t:0,p:{x:route[0].x,z:route[0].z}} : null;
}
function stepWalker(){
  if(!walker||!route) return;
  var a=route[walker.i], b=route[walker.i+1];
  if(!b){ walker.i=0; walker.t=0; return; }
  var L=Math.hypot(b.x-a.x, b.z-a.z)||1;
  walker.t += 0.4/L;
  if(walker.t>=1){ walker.t=0; walker.i++; if(walker.i>=route.length-1) walker.i=0; return; }
  walker.p={x:a.x+(b.x-a.x)*walker.t, z:a.z+(b.z-a.z)*walker.t};
}

/* ==================================================================
   9. หน้าจอส่วนล่าง

function setFloor(lvl, keepSel){
  cur=FLOORS.filter(function(f){ return f.lvl===lvl; })[0];
  HOME=framing(cur);
  cam=snapFrom(HOME);
  $("hLvl").textContent=cur.lvl;
  $("hZone").innerHTML=cur.zone.replace(/^My\s*/,"My <b>")+"</b>";
  $("hTag").textContent=cur.tag;
  var k=FLOORS.filter(function(x){ return x.lvl===KIOSK_LVL; })[0];
  $("youName").innerHTML = atKiosk()
    ? "คุณอยู่ที่ <b>ชั้น "+cur.lvl+" · "+cur.zone+"</b>"
    : "กำลังดู <b>ชั้น "+cur.lvl+" · "+cur.zone+"</b> · คุณยืนอยู่ชั้น "+k.lvl+" "+k.zone;
  if(!keepSel){ selected=null; route=null; walker=null; $("detail").className="detail"; }
  renderFloors(); renderGrid();
}
function snapFrom(h){ return {tx:h.tx, tz:h.tz, yaw:h.yaw, pitch:h.pitch, dist:h.dist}; }

  }).join("");

function renderCats(){
  $("cats").innerHTML=CATS.map(function(c){
    var dot = c.id ? '<i style="background:'+c.c+'"></i>' : '';
    return '<button class="cat'+(c.id===cat?" on":"")+'" data-cat="'+c.id+'">'+dot+c.name+'</button>';
  }).join("");
  Array.prototype.forEach.call($("cats").children,function(b){

/* ==================================================================
   9b. ภาพประกอบรายการแนะนำ
       วาดขึ้นเองจากชื่อรายการ ไม่มีไฟล์ภาพ ไม่ต่อออกนอกเครื่อง
       เหตุผลที่ไม่ใช้ภาพถ่ายจริง — ภาพบนเน็ตมีลิขสิทธิ์ · 459 ภาพฝังในไฟล์เดียว
       จะใหญ่หลายสิบเมกะไบต์ · และร้านเป็นร้านสมมติ ภาพจริงจะทำให้เข้าใจผิด
       กรอบ .pshot ออกแบบให้วางรูปถ่ายจริงทับได้เลยเมื่อของมา ไม่ต้องรื้อ layout
   ================================================================== */
function seedOf(str){
  var s=2166136261;
  for(var i=0;i<str.length;i++){ s^=str.charCodeAt(i); s=Math.imul(s,16777619); }
  return (s>>>0);
}
function rngOf(seed){
  var s=seed||1;
  return function(){ s^=s<<13; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}
function drawPick(cv2, name, catId){
  var g=cv2.getContext("2d"), w=cv2.width, h=cv2.height;
  var seed=seedOf(name), rnd=rngOf(seed);
  var base=CAT[catId] ? CAT[catId].c : "#B3743F";
  var hue=(seed%40)-20;

  /* พื้นหลังไล่เฉด ให้แต่ละรายการมีโทนของตัวเองแต่ยังอยู่ในตระกูลเดียวกัน */
  var bg=g.createLinearGradient(0,0,w,h);
  bg.addColorStop(0, tint(base, 0.80+rnd()*0.1));
  bg.addColorStop(1, tint(base, 0.55+rnd()*0.12));
  g.fillStyle=bg; g.fillRect(0,0,w,h);

  g.save(); g.globalAlpha=0.16; g.fillStyle="#F7F4EA";
  for(var k=0;k<3;k++){
    var rx=rnd()*w, ry=rnd()*h, rr=(0.2+rnd()*0.35)*w;
    g.beginPath(); g.arc(rx,ry,rr,0,6.2832); g.fill();
  }
  g.restore();

  var cx=w/2, cy=h*0.54, R=Math.min(w,h)*0.3;
  g.save();
  g.translate(cx,cy);
  if(catId==="dine" || catId==="cafe"){
    /* จาน/แก้ว มองจากด้านบน พร้อมของบนจาน */
    g.fillStyle="rgba(35,35,31,.14)";
    g.beginPath(); g.ellipse(2,4,R*1.06,R*1.06,0,0,6.2832); g.fill();
    g.fillStyle="#F7F4EA";
    g.beginPath(); g.arc(0,0,R,0,6.2832); g.fill();
    g.strokeStyle="rgba(35,35,31,.12)"; g.lineWidth=1;
    g.beginPath(); g.arc(0,0,R*0.8,0,6.2832); g.stroke();
    var n=4+Math.floor(rnd()*4);
    for(var i=0;i<n;i++){
      var a=(i/n)*6.2832 + rnd()*0.6, d=R*(0.16+rnd()*0.36);
      var ex=Math.cos(a)*d, ey=Math.sin(a)*d*0.9;
      g.save(); g.translate(ex,ey); g.rotate(rnd()*3);
      g.fillStyle="rgba(35,35,31,.10)";
      g.beginPath(); g.ellipse(1,2,R*(0.16+rnd()*0.14),R*(0.13+rnd()*0.11),0,0,6.2832); g.fill();
      g.fillStyle=tint(base, 0.42+rnd()*0.5);
      g.beginPath(); g.ellipse(0,0,R*(0.15+rnd()*0.15),R*(0.12+rnd()*0.12),0,0,6.2832); g.fill();
      g.fillStyle="rgba(247,244,234,.3)";
      g.beginPath(); g.ellipse(-R*0.04,-R*0.04,R*0.05,R*0.04,0,0,6.2832); g.fill();
      g.restore();
    }
    /* ใบตกแต่งบนจาน */
    g.fillStyle="rgba(120,140,110,.65)";
    for(var v=0;v<2;v++){
      var la=rnd()*6.2832, ld=R*0.42;
      g.save(); g.translate(Math.cos(la)*ld, Math.sin(la)*ld*0.9); g.rotate(rnd()*3);
      g.beginPath(); g.ellipse(0,0,R*0.14,R*0.055,0,0,6.2832); g.fill(); g.restore();
    }
  } else {
    /* สินค้า เป็นก้อนทรงเรียบวางบนเงา */
    g.fillStyle="rgba(35,35,31,.13)";
    g.beginPath(); g.ellipse(0,R*0.92,R*0.95,R*0.2,0,0,6.2832); g.fill();
    var bw=R*(1.0+rnd()*0.5), bh=R*(1.1+rnd()*0.5), rad=R*(0.1+rnd()*0.3);
    g.fillStyle=tint(base,0.42+rnd()*0.2);
    roundRect(g,-bw/2,-bh*0.72,bw,bh,rad); g.fill();
    g.fillStyle="rgba(247,244,234,.34)";
    roundRect(g,-bw/2+bw*0.12,-bh*0.62,bw*0.22,bh*0.72,rad*0.5); g.fill();
    g.fillStyle=tint(base,0.72);
    g.beginPath(); g.arc(bw*0.16,-bh*0.2,R*0.16,0,6.2832); g.fill();
  }
  g.restore();
}
function roundRect(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function tint(hex,k){
  var n=parseInt(hex.slice(1),16), r=n>>16&255, gg=n>>8&255, b=n&255;
  if(k<=1) return "rgb("+Math.round(r*k)+","+Math.round(gg*k)+","+Math.round(b*k)+")";
  var t=k-1;
  return "rgb("+Math.round(r+(255-r)*t)+","+Math.round(gg+(255-gg)*t)+","+Math.round(b+(255-b)*t)+")";
}
function baht(n){
  if(n===0) return "ฟรี";
  return n.toLocaleString("th-TH")+" ฿";
}
function renderPicks(s){
  $("dPickTitle").textContent = (s.cat==="dine"||s.cat==="cafe") ? "เมนูแนะนำ" : "สินค้าและบริการแนะนำ";
  var box=$("dPicks");
  box.innerHTML = s.picks.map(function(p,i){
    /* โชว์แค่ชื่อกับภาพ ไม่โชว์ราคา
       ราคาในห้างเปลี่ยนบ่อยกว่าตำแหน่งร้านมาก ถ้าตู้โชว์ราคาผิด
       คนจะไปโวยที่หน้าร้าน ไม่ใช่ที่ตู้ ร้านค้าจะเป็นคนรับผลแทน
       ตัวเลขราคายังอยู่ในข้อมูล ถ้าวันหน้ามีคนดูแลจริงค่อยเปิดใช้ */
    return '<div class="pick"><span class="pshot"><canvas id="pk'+i+'" width="240" height="180"></canvas></span>'+
           '<div class="pname">'+p[0]+'</div></div>';
  }).join("");
  s.picks.forEach(function(p,i){
    var c=$("pk"+i);
    if(c && c.getContext) drawPick(c, p[0], s.cat);
  });
}

function renderGrid(){
  var all=matches();
  var here=all.filter(function(s){ return s.lvl===cur.lvl; });
  var other=all.length-here.length;
  if(pickingFrom){
    $("scope").innerHTML = "<b>กำลังเลือกร้านต้นทาง</b> · แตะร้านที่ต้องการ";
  } else $("scope").innerHTML = (cat||query)
    ? "พบ <b>"+all.length+"</b> ร้าน · ชั้นนี้ "+here.length+" ร้าน"+(other?" · ชั้นอื่นอีก "+other+" ร้าน":"")
    : "ชั้น "+cur.lvl+" มี "+here.length+" ร้าน · ทั้งโครงการ "+TOTAL+" ร้าน";

  var list = (cat||query) ? all : here;
  if(!list.length){
    $("grid").innerHTML='<div class="empty">ไม่พบร้านที่ตรงกับที่ค้นหา<br>ลองคำสั้นลง หรือเลือกจากหมวดด้านบน</div>';
    return;
  }

  /* จัดกลุ่มตามหมวด แล้วขึ้นหัวเซกชันให้แต่ละกอง
     เหตุผลที่ไม่ปล่อยเป็นตารางรวมกองเดียว — ชั้นหนึ่งมีถึงแปดหมวดปนกัน
     คนที่ยืนหน้าตู้กวาดตาหาไม่เจอว่าอะไรเป็นอะไร ต้องกดกรองก่อนถึงจะอ่านออก
     พอมีหัวเซกชัน เห็นครั้งเดียวรู้เลยว่าชั้นนี้มีอะไรบ้าง อย่างละกี่ร้าน
     เรียงหมวดที่มีร้านเยอะไว้บน เพราะเป็นตัวที่บอกบุคลิกของชั้นนั้นได้ดีที่สุด */
  var groups={}, order=[];
  list.forEach(function(s){
    if(!groups[s.cat]){ groups[s.cat]=[]; order.push(s.cat); }
    groups[s.cat].push(s);
  });
  order.sort(function(x,y){
    var d=groups[y].length-groups[x].length;
    if(d) return d;
    return (CAT[x]?CAT[x].name:"").localeCompare(CAT[y]?CAT[y].name:"");
  });

  /* เลือกหมวดเดียวอยู่แล้ว ไม่ต้องขึ้นหัวซ้ำ */
  var oneCat = !!cat || order.length<2;
  var html="";
  order.forEach(function(cid){
    var g=groups[cid].slice().sort(function(a,b){
      return (a.lvl-b.lvl) || a.name.localeCompare(b.name,"th");
    });
    var c=CAT[cid]?CAT[cid].c:"#C7BFA8";
    if(!oneCat){
      html += '<div class="sechead"><i style="background:'+c+'"></i>'+
              '<h3>'+(CAT[cid]?CAT[cid].name:"อื่นๆ")+'</h3>'+
              '<span>'+g.length+' ร้าน</span></div>';
    }
    g.forEach(function(s){
      html += '<div class="card'+(selected===s?" on":"")+'" role="button" tabindex="0" data-no="'+s.no+'">'+
        '<span class="bar" style="background:'+c+'"></span>'+
        '<div class="mono" style="background:'+(selected===s?"rgba(247,244,234,.14)":c+"33")+'">'+s.mono+'</div>'+
        '<div class="cname">'+s.name+'</div>'+
        '<div class="cunit">ชั้น '+s.lvl+'</div></div>';
    });
  });
  $("grid").innerHTML=html;

  Array.prototype.forEach.call($("grid").children,function(b){
    if(!b.getAttribute || !b.getAttribute("data-no")) return;
    var go=function(){
      var no=b.getAttribute("data-no"), s=null;
      FLOORS.forEach(function(f){ f.shops.forEach(function(x){ if(x.no===no) s=x; }); });
      select(s);
    };
    b.addEventListener("click", go);
    b.addEventListener("keydown", function(e){
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); go(); }
    });
  });
}

function select(s, fromMap){
  if(!s) return;
  /* ถ้ากำลังเลือกต้นทางอยู่ ให้ร้านที่กดกลายเป็นต้นทาง ไม่ใช่ปลายทาง */
  if(pickingFrom){
    if(selected && s===selected){ toast("ต้นทางกับปลายทางเป็นร้านเดียวกันไม่ได้"); return; }
    origin=s; pickingFrom=false;
    if(selected) select(selected);
    else { renderGrid(); kick(); }
    return;
  }
  if(!visible(s)){
    cat=""; query=""; $("q").value=""; $("qclear").className="qclear";
    renderCats();
  }
  if(origin===s) origin=null;          /* ปลายทางซ้ำกับต้นทาง ล้างต้นทางทิ้ง */
  selected=s;
  plan=buildPlan(origin, s);
  stepAt=0;

  /* แผนที่แสดงชั้นของขาสุดท้ายเสมอ เพราะเป็นชั้นที่ร้านปลายทางอยู่ */
  if(s.lvl!==cur.lvl) setFloor(s.lvl, true);
  route = plan ? plan.legs[plan.legs.length-1].path : null;

  if(plan){
    legNote = "<b>"+plan.mins+" นาที</b> ("+Math.round(plan.totalM)+" เมตร)"
            + (plan.up ? " · ข้ามชั้น" : "");
  } else {
    legNote = "ยังหาเส้นทางไปร้านนี้ไม่ได้";
  }
  startWalker(); flyTo(s);
  $("dMono").textContent=s.mono;
  $("dMono").style.background=(CAT[s.cat]?CAT[s.cat].c:"#C7BFA8")+"33";
  $("dName").textContent=s.name;
  $("dKind").textContent=(CAT[s.cat]?CAT[s.cat].name:"")+" · ชั้น "+s.lvl+" "+cur.zone;
  $("dDesc").textContent=s.desc;
  renderPicks(s);
  syncBar();
  $("dWay").innerHTML=legNote;
  $("dSteps").style.display = plan ? "" : "none";
  $("detail").className="detail on";
  $("steps").className="steps";
  renderGrid();
  scrollToCard(s);
  kick();
}

   9c. โหมดขั้นตอน
       กล้องซูมเข้าหาช่วงที่กำลังอธิบายอยู่ ไม่ใช่โชว์ทั้งชั้น
       ถ้าโชว์ทั้งชั้น คนจะมองไม่ออกว่าตัวเองต้องเดินไปทางไหน
   ================================================================== */
function openSteps(){

  $("stage").className="stage navi";

function showStep(){
  var st=plan.steps[stepAt], n=plan.steps.length;
  $("sNum").textContent=stepAt+1;
  $("sTot").textContent=n;
  $("sText").innerHTML=st.text;
  $("sSub").textContent=st.sub||"";
  $("sPrev").disabled = stepAt===0;
  $("sNext").disabled = stepAt===n-1;

  /* ไทม์ไลน์แบบจุดต่อเส้น จุดคือขั้นตอน เส้นคือช่วงที่ผ่านมาแล้ว
     ขั้นข้ามชั้นใช้สัญลักษณ์ต่างจากขั้นเดิน จะได้เห็นแต่ไกลว่าต้องขึ้นลงตรงไหน */
  var tl="";
  for(var i=0;i<n;i++){
    if(i) tl += '<span class="tseg'+(i<=stepAt?" done":"")+'"></span>';
    var cls = i<stepAt ? "done" : (i===stepAt ? "now" : "");
    if(i===n-1 && stepAt===n-1) cls="end";
    var gl = plan.steps[i].kind==="lift" ? (plan.steps[i].up.to>plan.steps[i].up.from?"▲":"▼") : "•";
    tl += '<span class="tnode '+cls+'">'+gl+'</span>';
  }
  $("sLine").innerHTML=tl;

  /* รายการขั้นตอนทั้งหมด ซ่อนไว้ ลากแผงขึ้นถึงจะเห็น
     กดข้ามไปขั้นไหนก็ได้ ไม่ต้องกดถัดไปทีละขั้น */
  var li="";
  plan.steps.forEach(function(s,i){
    li += '<div class="sitem'+(i===stepAt?" now":"")+'" data-i="'+i+'">'+
          '<b>'+(i+1)+'</b><span>'+s.text.replace(/<[^>]+>/g,"")+'</span></div>';
  });
  $("sList").innerHTML=li;
  Array.prototype.forEach.call($("sList").children,function(el){
    el.addEventListener("click",function(){
      stepAt=parseInt(el.getAttribute("data-i"),10); showStep(); kick();
    });
  });

  /* การ์ดลอยทับแผนที่ ขึ้นเฉพาะขั้นข้ามชั้นกับขั้นสุดท้าย
     สองจุดนี้คือจุดที่คนหลงมากที่สุด ถ้าขึ้นทุกขั้นจะบังแผนที่จนไม่มีใครสนใจ */
  if(st.kind==="lift"){
    var up=st.up.to>st.up.from;
    $("fIcon").textContent = up ? "▲" : "▼";
    $("fHead").innerHTML = 'ชั้น '+st.up.from+' <em>›</em> ชั้น '+st.up.to;
    $("fText").textContent = (up?"ขึ้น":"ลง")+"บันไดเลื่อนไปยังชั้น "+st.up.to;
    $("fCard").className="fcard on";
  } else if(stepAt===n-1){
    $("fIcon").textContent="◎";
    $("fHead").innerHTML="ถึงแล้ว";   /* ต้องใช้ innerHTML ให้ตรงกับตอนเซ็ตของขั้นข้ามชั้น ไม่งั้นหัวเก่าค้าง */
    $("fText").textContent=plan.to.label+" · ชั้น "+st.lvl;
    $("fCard").className="fcard on";
  } else $("fCard").className="fcard";

  if(st.lvl!==cur.lvl) setFloor(st.lvl, true);
  var leg=null;
  plan.legs.forEach(function(l){ if(l.lvl===st.lvl && !leg) leg=l; });
  route = leg ? leg.path : null;
  flyStep(st);
  startWalker();
}
function flyStep(st){
  var mx=(st.a.x+st.b.x)/2, mz=(st.a.z+st.b.z)/2;
  var len=Math.hypot(st.b.x-st.a.x, st.b.z-st.a.z);
  var d=Math.max(ZMIN, Math.min(ZMAX, 34+len*1.5));
  /* หันกล้องให้ทิศเดินพุ่งขึ้นจอ คนจะได้อ่านว่าซ้ายขวาตรงกับที่เห็น */
  var yaw = (len>1) ? Math.atan2(st.a.x-st.b.x, st.a.z-st.b.z) : cam.yaw;
  var dd=yaw-cam.yaw;
  while(dd> Math.PI) dd-=Math.PI*2;
  while(dd<-Math.PI) dd+=Math.PI*2;
  flying={t:0, from:snapCam(), to:{tx:mx, tz:mz, yaw:cam.yaw+dd, pitch:0.62, dist:d}};
}

/* เลื่อนตารางร้านไปหาการ์ดที่เพิ่งเลือก คนจะได้เห็นว่าตึกที่จิ้มคือการ์ดใบไหน */
