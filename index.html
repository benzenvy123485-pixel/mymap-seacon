/* ==================================================================
   10b. จิ้มเลือกร้านบนแผนผังโดยตรง
        ตึกเป็นก้อนสามมิติ เงาบนจอจึงเป็นรูปหลายเหลี่ยมของมุมทั้งแปด
        (สี่มุมล่าง สี่มุมบน) หาเปลือกนูนของจุดที่ฉายแล้ว
        แล้วเช็คว่านิ้วตกในนั้นไหม ถ้าซ้อนกันหลายก้อน เลือกก้อนที่ใกล้กล้องที่สุด
   ================================================================== */
function silhouette(s){
  var pts=[], i, c=s.corners;
  for(i=0;i<4;i++){
    var a=P(c[i].x, 0, c[i].z), b=P(c[i].x, s.h + s.pop*2.2, c[i].z);
    if(!a || !b) return null;
    pts.push(a); pts.push(b);
  }
  return hull2d(pts);
}
function hull2d(p){
  var q=p.slice().sort(function(a,b){ return a.x-b.x || a.y-b.y; });
  function cr(o,a,b){ return (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x); }
  var lo=[], hi=[], i;
  for(i=0;i<q.length;i++){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],q[i])<=0) lo.pop(); lo.push(q[i]); }
  for(i=q.length-1;i>=0;i--){ while(hi.length>=2 && cr(hi[hi.length-2],hi[hi.length-1],q[i])<=0) hi.pop(); hi.push(q[i]); }
  lo.pop(); hi.pop();
  return lo.concat(hi);
}
function inPoly2d(poly, x, y){
  var c=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    if(((poly[i].y>y)!==(poly[j].y>y)) &&
       (x < (poly[j].x-poly[i].x)*(y-poly[i].y)/(poly[j].y-poly[i].y)+poly[i].x)) c=!c;
  }
  return c;
}
function pickAt(sx, sy){
  updateCam();
  var best=null;
  for(var i=0;i<cur.shops.length;i++){
    var s=cur.shops[i], sil=silhouette(s);
    if(!sil || !inPoly2d(sil, sx, sy)) continue;
    var d=(s.cx-eye.x)*(s.cx-eye.x)+(s.cz-eye.z)*(s.cz-eye.z);
    /* ร้านที่ตรงตัวกรองอยู่ ให้ชนะร้านที่ถูกหรี่ไว้เสมอ
       เพราะร้านที่หรี่จะเตี้ยลง คนไม่ได้ตั้งใจจิ้มมัน */
    var v=visible(s) ? 0 : 1;
    if(!best || v<best.v || (v===best.v && d<best.d)) best={d:d, v:v, s:s};
  }
  return best ? best.s : null;
}


/* ==================================================================
   9d. แผงเลือกร้านต้นทาง–ปลายทาง
       เดิมต้องกดปุ่ม "จาก" แล้วไปแตะร้านบนแผนผังหรือในตาราง
       ซึ่งใช้ได้ก็จริงแต่คนไม่รู้ว่าต้องทำอย่างนั้น และถ้าร้านต้นทางอยู่คนละชั้น
       ต้องสลับชั้นไปหาเองก่อน แผงนี้พิมพ์ชื่อค้นได้ทุกชั้นในที่เดียว
   ================================================================== */
var rpFor="from";       /* กำลังเลือกช่องไหนอยู่ from หรือ to */

function allShops(){
  var out=[];
  FLOORS.forEach(function(f){ f.shops.forEach(function(s){ out.push(s); }); });
  return out;
}
function openPicker(which){
  rpFor=which;
  $("rpTitle").textContent = which==="from" ? "เลือกจุดเริ่มต้น" : "เลือกร้านปลายทาง";
  $("rpQ").value=""; $("rpClear").className="qclear";
  renderPicker();
  $("rPanel").className="rpanel on";
  kick();
}
function closePicker(){ $("rPanel").className="rpanel"; kick(); }

function renderPicker(){
  var q=$("rpQ").value.trim().toLowerCase();
  var list=allShops().filter(function(s){
    if(rpFor==="from" && selected && s===selected) return false;   /* ต้นทางซ้ำปลายทางไม่ได้ */
    if(rpFor==="to" && origin && s===origin) return false;
    if(!q) return true;
    var hay=(s.name+" "+s.desc+" "+(CAT[s.cat]?CAT[s.cat].name:"")).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  list.sort(function(a,b){ return (a.lvl-b.lvl) || a.name.localeCompare(b.name,"th"); });

  var html="";
  /* จุดที่ตู้ตั้งอยู่ ปักไว้บนสุดเสมอในช่องต้นทาง เพราะเป็นค่าที่คนใช้บ่อยที่สุด */
  if(rpFor==="from" && !q){
    var k=floorOf(KIOSK_LVL);
    html += '<button class="ritem" data-kiosk="1">'+
            '<span class="rimono" style="background:rgba(192,112,63,.16);color:#C0703F">◉</span>'+
            '<span class="ribody"><span class="riname">จุดที่คุณยืน</span>'+
            '<span class="rimeta">ชั้น '+k.lvl+' · '+k.zone+'</span></span>'+
            '<span class="riflag">ค่าตั้งต้น</span></button>';
  }
  if(!list.length && !html){
    $("rpList").innerHTML='<div class="rpempty">ไม่พบร้านที่ตรงกับที่ค้นหา<br>ลองพิมพ์คำสั้นลง</div>';
    return;
  }
  list.forEach(function(s){
    var c=CAT[s.cat]?CAT[s.cat].c:"#C7BFA8";
    html += '<button class="ritem" data-no="'+s.no+'">'+
            '<span class="rimono" style="background:'+c+'33">'+s.mono+'</span>'+
            '<span class="ribody"><span class="riname">'+s.name+'</span>'+
            '<span class="rimeta">'+(CAT[s.cat]?CAT[s.cat].name:"")+' · ชั้น '+s.lvl+'</span></span>'+
            '</button>';
  });
  $("rpList").innerHTML=html;
  $("rpList").scrollTop=0;
  Array.prototype.forEach.call($("rpList").children,function(b){
    if(!b.getAttribute) return;
    b.addEventListener("click",function(){
      var s=null;
      if(b.getAttribute("data-kiosk")) s=null;
      else {
        var no=b.getAttribute("data-no");
        FLOORS.forEach(function(f){ f.shops.forEach(function(x){ if(x.no===no) s=x; }); });
        if(!s) return;
      }
      applyPick(s);
    });
  });
}
function applyPick(s){
  closePicker();
  if(rpFor==="from"){
    origin=s;
    if(selected){ select(selected); if($("rDlg").className.indexOf("on")>=0) $("detail").className="detail"; }
    syncBar();
    if(!selected && s) toast("ตั้งต้นทางแล้ว · เลือกร้านปลายทางต่อ");
  } else {
    if(!s) return;
    select(s);
    closeDlg();
  }
}
function swapEnds(){
  if(!selected || !origin){ toast("ต้องเลือกร้านทั้งต้นทางและปลายทางก่อนถึงจะสลับได้"); return; }
  var a=origin, b=selected;
  origin=b; select(a);
}

/* ==================================================================
   10. แตะ ลาก หุบนิ้ว
   ================================================================== */
var drag=null, pinch=null;
cv.addEventListener("pointerdown",function(e){
  if(e.isPrimary){ drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:0}; cv.setPointerCapture(e.pointerId); }
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(pts).length===2) pinch=spread();
  kick();
});
var pts={};
function spread(){
  var k=Object.keys(pts);
  if(k.length<2) return null;
  return Math.hypot(pts[k[0]].x-pts[k[1]].x, pts[k[0]].y-pts[k[1]].y);
}
cv.addEventListener("pointermove",function(e){
  if(pts[e.pointerId]) pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var k=Object.keys(pts);
  if(k.length>=2){
    var s=spread();
    if(pinch && s){ cam.dist=Math.max(ZMIN,Math.min(ZMAX, cam.dist*(pinch/s))); pinch=s; flying=null; }
    return;
  }
  if(!drag) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  cam.yaw-=dx*0.0072;
  cam.pitch=Math.max(0.28,Math.min(1.26, cam.pitch+dy*0.0042));
  drag.x=e.clientX; drag.y=e.clientY; flying=null;
});
function up(e){
  /* ขยับน้อยกว่า 9 พิกเซล ถือว่าเป็นการจิ้ม ไม่ใช่ลาก
     ต้องมีเกณฑ์นี้เพราะนิ้วคนสั่นเสมอ ถ้าเอา 0 จะจิ้มไม่ติดเลย */
  if(e.isPrimary && drag && drag.moved<9 && Object.keys(pts).length<2){
    var r=cv.getBoundingClientRect();
    var s=pickAt(e.clientX-r.left, e.clientY-r.top);
    if(s) select(s); else if(selected) deselect();
  }
  delete pts[e.pointerId];
  if(Object.keys(pts).length<2) pinch=null;
  if(e.isPrimary) drag=null;
  kick();
}
cv.addEventListener("pointerup",up);
cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",function(e){ e.preventDefault(); zoom(e.deltaY>0?1.1:0.9); },{passive:false});

/* ลากที่จับขึ้นเพื่อกางรายการขั้นตอนทั้งหมด ลากลงเพื่อยุบ
   แตะเฉยๆ ก็สลับได้ ไม่ต้องลากจริง เพราะบนทัชสกรีนตั้งพื้นการลากทำยากกว่าแตะ */
(function(){
  var g=$("sGrip"), y0=null;
  function toggle(){
    var s=$("steps");
    s.className = (s.className.indexOf("tall")<0) ? "steps on tall" : "steps on";
  }
  g.addEventListener("click", toggle);
  g.addEventListener("pointerdown", function(e){ y0=e.clientY; });
  g.addEventListener("pointerup", function(e){
    if(y0===null) return;
    var d=e.clientY-y0; y0=null;
    if(Math.abs(d)<8) return;                 /* ขยับน้อย ถือว่าเป็นการแตะ ปล่อยให้ click จัดการ */
    var s=$("steps");
    s.className = (d<0) ? "steps on tall" : "steps on";
  });
})();

/* ==================================================================
   11. โหมดดึงคน — ไม่มีคนแตะ 60 วินาที กล้องหมุนรอบชั้นช้าๆ
   ================================================================== */
function kick(){
  idleSpin=false; $("hint").className="hint"; clearTimeout(idleTimer);
  idleTimer=setTimeout(function(){
    idleSpin=true; $("hint").className="hint gone";
    if(selected) deselect();
    $("steps").className="steps"; $("fCard").className="fcard";
    $("rPanel").className="rpanel"; $("rDlg").className="rdlg"; $("veil").className="veil";
    $("stage").className="stage"; pickingFrom=false; origin=null;
    $("q").value=""; query=""; cat=""; $("qclear").className="qclear";
    if(cur.lvl!==FLOORS[0].lvl) setFloor(FLOORS[0].lvl);
    renderCats(); renderGrid();
  },60000);
}
